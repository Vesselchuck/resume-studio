  /* ─── actions ──────────────────────────────────────────────── */

  function select(id) {
    if (state.active === id) return;
    state.active = id;
    renderAll();
    if (!state.render[id]) preview(id);
  }

  // A preview asked for while the engine was busy. Rendering right then
  // would be refused (one render at a time), and dropping the request
  // would leave the pane showing something older — a previous save, or
  // the other document's file after switching cards — so it is
  // remembered here and run as soon as the engine is free. One slot: the
  // latest request wins, since it is the one the pane should end up on.
  //   { id, fromChange }   fromChange: a file save, which renders
  //                        whichever document is active by then
  var pendingPreview = null;

  // The page images a render holds, by page and by pixel hash, so the
  // next preview can ask the server to skip pages that did not change.
  function heldImages(r) {
    var known = {}, byHash = {};
    ((r && r.images) || []).forEach(function (im) {
      if (!im.hash || !im.png) return;
      known[im.page] = im.hash;
      byHash[im.hash] = im.png;
    });
    return { known: known, byHash: byHash };
  }

  /* ─── streamed pages ───────────────────────────────────────────
   *
   * A streaming render sends each page on the event stream as it is
   * ready, ahead of the reply. Two things keep that honest:
   *
   *   • A render id. Each request carries one, each event repeats it,
   *     and an event from anything but the render this document is
   *     waiting for is dropped — a fast second save must not paint a
   *     page of the render it superseded.
   *   • The arriving pages are painted straight into the sheets on
   *     screen but are NOT written into state.render, which stays the
   *     last complete render until the reply lands. So a render that
   *     fails halfway leaves the pane holding the last good render
   *     (redrawn from state), not a mixture of two.
   */
  var streamRender = { resume: null, letter: null };

  function newRenderId(id) {
    var rid = id + ':' + Date.now() + ':' + Math.random().toString(36).slice(2, 8);
    streamRender[id] = { id: rid, pages: {} };
    return rid;
  }

  /** Put the pages of the render in flight back onto a rebuilt canvas. */
  function repaintStreamed(doc) {
    var cur = streamRender[doc];
    if (!cur || state.busy[doc] !== 'render') return;
    Object.keys(cur.pages).forEach(function (page) {
      paintPage(doc, cur.pages[page]);
    });
  }

  function applyStreamedPage(doc, rid, im) {
    var cur = streamRender[doc];
    if (!cur || cur.id !== rid) return;          // a superseded render
    if (!im || !im.png || !im.page) return;
    cur.pages[im.page] = im;
    paintPage(doc, im);
  }

  /** Draw one page image into the sheet that is showing that page. */
  function paintPage(doc, im) {
    if (doc !== state.active || !im || !im.png) return;
    var wrap = $('scroller').querySelector('.sheet-wrap[data-page="' + im.page + '"]');
    if (!wrap) return;                           // no sheet for it yet; the reply will draw it
    var sheet = wrap.querySelector('.sheet');
    if (!sheet) return;
    var existing = sheet.firstElementChild;
    if (existing && existing.dataset && existing.dataset.hash === im.hash) return;
    // An element already made for this page (the canvas was rebuilt
    // while it decoded) is reused rather than decoded a second time.
    var key = im.hash || im.png;
    var img = pageImages.get(key);
    if (!img || img.isConnected) {
      img = pageImage(im, true);
      img.dataset.hash = im.hash || '';
    }
    pageImages.set(key, img);
    // The old page stays up until the new one is decoded. Swapping first
    // left the sheet blank for a frame or more while the PNG decoded.
    var swap = function () {
      var cur = streamRender[doc];
      // The render ended meanwhile (its reply drew the canvas), or a
      // newer image of this page arrived: this one is not wanted.
      if (doc !== state.active || !cur || cur.pages[im.page] !== im || img.isConnected) return;
      var w = $('scroller').querySelector('.sheet-wrap[data-page="' + im.page + '"]');
      var s = w && w.querySelector('.sheet');
      if (!s) return;
      var shown = s.firstElementChild;
      if (shown && shown.dataset && shown.dataset.hash === im.hash) return;
      s.replaceChildren(img);
    };
    if (typeof img.decode === 'function') img.decode().then(swap, swap);
    else swap();
  }

  async function preview(id, opts) {
    id = id || state.active;
    opts = opts || {};
    var m = docMeta(id);
    if (!m) return;
    if (state.busy.resume || state.busy.letter) {
      pendingPreview = {
        id: id, fromChange: Boolean(opts.fromChange),
        retry: Boolean(opts.retry) || Boolean(pendingPreview && pendingPreview.retry),
      };
      return;
    }
    // Which pages are on screen, asked before the canvas is rebuilt for
    // the busy state — the answer is about what the user is looking at
    // now, not about the elements that are about to replace it.
    var order = visiblePages(id);
    setBusy(id, 'render');
    renderAll();
    var before = state.render[id];
    try {
      // Unchanged pages come back as {hash, unchanged: true} with no PNG;
      // the image this page already has is put back in by hash.
      var held = heldImages(state.render[id]);
      var rid = newRenderId(id);
      var r = await api('POST', '/api/preview', {
        doc: id, scale: RASTER_SCALE, known: held.known,
        stream: true, renderId: rid, order: order,
        // Only a render the user asked for: it may restart a Python
        // worker that stopped restarting after repeated crashes.
        retry: Boolean(opts.retry),
      });
      var missing = false;
      var arrived = (streamRender[id] && streamRender[id].id === rid)
        ? streamRender[id].pages : {};
      (r.images || []).forEach(function (im) {
        if (im.sent) {
          // Already delivered on the event stream.
          if (arrived[im.page] && arrived[im.page].hash === im.hash) {
            im.png = arrived[im.page].png;
          } else {
            missing = true;
          }
          delete im.sent;
          return;
        }
        if (!im.unchanged) return;
        if (held.byHash[im.hash]) im.png = held.byHash[im.hash];
        else missing = true;
        delete im.unchanged;
      });
      // Cannot happen unless the held images changed under the request,
      // or an event was lost; if it does, ask again for every page — and
      // without streaming, so the answer is complete in itself.
      if (missing) r = await api('POST', '/api/preview', { doc: id, scale: RASTER_SCALE });
      state.render[id] = r;
      state.renderedAt[id] = Date.now();
      delete state.error[id];
      highlightChanges(id, before, r);
    } catch (err) {
      // A new failure opens Diagnostics, where the console has the rest.
      if (state.error[id] !== err.message) state.diagAuto = true;
      state.error[id] = err.message;
    } finally {
      // This render is over: its streamed pages are either in
      // state.render now or belong to a render that failed, and either
      // way nothing should paint them again.
      if (streamRender[id] && streamRender[id].id === rid) streamRender[id] = null;
      setBusy(id, null);
      await refreshStatusQuietly();
      renderAll();
    }
    runPendingPreview();
  }

  function runPendingPreview() {
    if (!pendingPreview) return;
    if (state.busy.resume || state.busy.letter) return;
    var next = pendingPreview;
    pendingPreview = null;
    if (next.fromChange) {
      if (state.paused) return;
      var m = docMeta(state.active);
      if (!m || !m.live) return;
      preview(null, { fromChange: true, retry: next.retry });
    } else {
      preview(next.id, { retry: next.retry });
    }
  }

  async function doBuild(id) {
    var shownAtStart = state.active;
    setBusy(id, 'build');
    delete state.buildError[id];
    var mark = state.log.length;   // where this build's output starts
    renderAll();
    try {
      var r = await api('POST', '/api/build',
        { doc: id, snapshot: state.snapshot,
          tests: state.tests, scale: RASTER_SCALE });

      var drift = state.log.slice(mark)
        .filter(function (l) { return /% difference \(limit/.test(l); })
        .map(function (l) { return l.replace(/^\s*[❌⚠️]\s*/, '').trim(); });
      if (drift.length) {
        state.buildError[id] = {
          kind: 'notice',
          lines: drift.slice(0, 6),
          hint: 'The PDFs were written. Accept this as the new baseline with: '
              + 'python build/snapshot_pdf.py --update',
        };
      }

      // Building the document that is not on screen shows it, when the
      // build hands back its pages: the pane then shows the file just
      // written, which is the confirmation the build was asking for.
      // Not if you moved to another document while it ran — that was a
      // choice, and a build finishing should not undo it.
      var switchTo = id !== state.active && state.active === shownAtStart
        && r.render && r.render.images && r.render.images.length;
      toast('Built ' + docMeta(id).label + (switchTo ? ' — now showing it' : ''),
        drift.length ? 'snapshot differs — PDFs written anyway'
                     : (id === 'resume' ? 'Cover Letter' : 'Resume') + ' untouched');
      setBusy(id, null);
      if (switchTo) state.active = id;
      await refreshStatus();

      // Show the file the build just wrote, not a re-render of it.
      //
      // This used to call preview(id), which ran the whole pipeline a
      // second time — measure, solve, final, print, rasterize — to
      // arrive at the same pixels already sitting in dist/. The server
      // now rasterizes the built PDF on the way back, so the pane is
      // showing the actual deliverable and the build round trip lost
      // about 600 ms of recomputation.
      //
      // The live render stays the fallback: if the server could not
      // rasterize (no PDF, a wedged worker), fall through to it rather
      // than leaving the pane stale.
      if (r.render && r.render.images && r.render.images.length) {
        // A built PDF read back carries no fill (that comes from the
        // solver, which a read-back does not run), so the chip would
        // vanish on every Build. Keep the last render's figure until
        // the next render replaces it.
        var prevFill = state.render[id] && state.render[id].invariants
          && state.render[id].invariants.fill;
        var inv = r.render.invariants;
        if (prevFill && inv && inv.ok && !inv.fill) {
          r.render.invariants = Object.assign({}, inv, { fill: prevFill });
        }
        state.render[id] = r.render;
        state.renderedAt[id] = Date.now();
        delete state.error[id];
        renderAll();
      } else {
        await preview(id);
      }
    } catch (err) {
      // The preview is still valid — it was the CLI build that failed,
      // so this must not masquerade as a YAML error. `resume.js failed`
      // is also not a reason; the reason is in the log the build just
      // streamed, so pull the failure lines out of it.
      var since = state.log.slice(mark);
      var reasons = (err.failures || [])
        .concat(since)
        .filter(function (l) { return l.indexOf('❌') !== -1; })
        .map(function (l) { return l.replace(/^\s*❌\s*/, '').trim(); });
      reasons = reasons.filter(function (l, i) { return reasons.indexOf(l) === i; });
      var hint = (err.failures || []).concat(since)
        .filter(function (l) { return /snapshot_pdf\.py/.test(l); })
        .map(function (l) { return l.trim(); })[0];

      state.buildError[id] = {
        lines: reasons.length ? reasons.slice(0, 6) : [err.message],
        hint: hint || null,
      };
      toast('Build failed', reasons[0] ? reasons[0].slice(0, 70) : err.message.slice(0, 70));
      state.diagAuto = true;
      setBusy(id, null);
      await refreshStatusQuietly();
      renderAll();
    }
    runPendingPreview();
  }

  /**
   * One control, two kinds of choice: a resolution mode, or a specific
   * file. Picking a file sets the explicit override; picking a mode
   * clears it, so the two can never both be in force.
   */
  async function chooseData(id, value) {
    try {
      if (value.indexOf('file:') === 0) {
        await api('POST', '/api/pick', { doc: id, name: value.slice(5) });
        toast('Reading ' + value.slice(5), 'nothing was copied or modified');
      } else {
        var mode = value.slice(5);
        await api('POST', '/api/pick', { doc: id, name: null });
        if (id === 'resume') {
          await api('POST', '/api/datasource', { source: mode === 'auto' ? null : mode });
        }
        toast('Data source: ' + mode, 're-rendering');
      }
      await refreshStatus();
      renderAll();
      preview(id);
    } catch (err) {
      toast('Could not switch', err.message.slice(0, 90));
    }
  }

  async function setDataSource(source) {
    await api('POST', '/api/datasource', { source: source });
    // The card names the file the next build reads, and that just
    // changed — re-read the status before redrawing or it keeps
    // reporting the previous choice.
    await refreshStatus();
    state.dataSource = source;
    toast('Data source: ' + (source || 'auto'), 're-rendering');
    renderAll();
    preview();
  }

  /** For cleanup paths: an unreachable engine must not stop the redraw. */
  async function refreshStatusQuietly() {
    try {
      await refreshStatus();
    } catch (err) {
      $('envLine').textContent = 'disconnected from the engine';
    }
  }

  async function refreshStatus() {
    state.status = await api('GET', '/api/status');
    state.dataSource = state.status.dataSource;
    // Compact: which project, and whether a render will start warm. The
    // Python version and worker pid are under Diagnostics.
    $('envLine').textContent =
      state.status.root.split(/[\\/]/).pop() +
      ' · chromium ' + (state.status.browserOpen ? 'warm' : 'cold');
  }

  /* ─── zoom, pause, menu ────────────────────────────────────── */

  $('pauseBtn').addEventListener('click', function () {
    state.paused = !state.paused;
    // One label, pressed or not: a toggle whose name flips between
    // "Pause" and "Resume" reads as pressed "Resume" to a screen reader.
    this.setAttribute('aria-pressed', String(state.paused));
    renderCanvas();
    toast(state.paused ? 'Auto-render paused' : 'Auto-render resumed',
      state.paused ? 'saving a file will not re-render' : 'watching data/ and styles/');
    // Saves made while paused: render them now, or "Live" shows stale pages.
    if (!state.paused && state.missedChange) {
      state.missedChange = false;
      var m = docMeta(state.active);
      if (m && m.live) preview(null, { fromChange: true });
    }
  });

  function rerender() { preview(null, { retry: true }); }
  $('menuRefresh').addEventListener('click', rerender);
  async function reveal(target) {
    try {
      var r = await api('POST', '/api/reveal', { path: target });
      toast('Opened in your file manager', r.revealed);
    } catch (err) {
      toast('Could not open it', err.message.slice(0, 80));
    }
  }

  $('menuOpenDist').addEventListener('click', function () { reveal('dist'); });

  // Tell the server when this page is hidden (the window minimized) or
  // shown again: after five minutes hidden it closes Chromium, and it
  // relaunches it as soon as the page is visible. Best effort — a lost
  // report only means Chromium stays open. In a browser (`npm run ui`)
  // this is the report. In the desktop app WebView2 never fires it on
  // minimize, so the Tauri shell sends its own report (main.rs,
  // note_minimized). The report names this page (the id the event
  // stream's `hello` gave it), so the server can wait for every open
  // page to be hidden rather than obey whichever reported last; it is
  // sent again on each hello, so a page that opens in the background, or
  // reconnects, is counted as it is.
  var clientId = null;
  function reportVisibility() {
    if (!clientId) return;
    api('POST', '/api/visibility', { hidden: document.hidden, client: clientId })
      .catch(function () {});
  }
  document.addEventListener('visibilitychange', reportVisibility);

  /* ─── dialogs ──────────────────────────────────────────────── */

  // A modal takes focus when it opens, keeps Tab inside itself, and
  // gives focus back to whatever had it when it closes. Returns close().
  // They can stack (a file dropped while Data files is open): only the
  // topmost traps Tab and answers Escape, or two traps fight over focus.
  var dialogs = [], dialogSeq = 0;
  function openDialog(scrim, box, title) {
    var opener = document.activeElement;
    if (!title.id) title.id = 'dlg-title-' + (++dialogSeq);
    box.setAttribute('role', 'dialog');
    box.setAttribute('aria-modal', 'true');
    box.setAttribute('aria-labelledby', title.id);
    function focusables() {
      return Array.prototype.filter.call(box.querySelectorAll(FOCUSABLE), function (n) {
        return !n.disabled && n.getClientRects().length > 0;
      });
    }
    function onKey(e) {
      if (e.key !== 'Tab' || dialogs[dialogs.length - 1] !== close) return;
      var f = focusables();
      if (!f.length) { e.preventDefault(); return; }
      var inside = box.contains(document.activeElement);
      if (e.shiftKey && (!inside || document.activeElement === f[0])) {
        e.preventDefault(); f[f.length - 1].focus();
      } else if (!e.shiftKey && (!inside || document.activeElement === f[f.length - 1])) {
        e.preventDefault(); f[0].focus();
      }
    }
    document.addEventListener('keydown', onKey);
    document.body.appendChild(scrim);
    var first = focusables()[0];
    if (first) first.focus();
    function close() {
      if (!scrim.isConnected) return;
      scrim.remove();
      document.removeEventListener('keydown', onKey);
      dialogs.splice(dialogs.indexOf(close), 1);
      if (opener && opener !== document.body && opener.isConnected) opener.focus();
    }
    dialogs.push(close);
    return close;
  }

  /* ─── data-file dialog ─────────────────────────────────────── */

  var DOC_LABEL = { resume: 'Resume', letter: 'Cover Letter' };

  $('openDlg').addEventListener('click', openFiles);

  async function openFiles() {
    var data = await api('GET', '/api/datafiles');
    state.files = data.files;

    var scrim = el('div', 'scrim');
    var modal = el('div', 'modal');
    var h = el('div', 'modal-h');
    var title = el('h3', null, 'Data files');
    h.appendChild(title);
    h.appendChild(el('span', 'chip', 'data/'));
    var close;
    modal.appendChild(h);

    var body = el('div', 'modal-b');
    if (!state.files.length) {
      body.appendChild(el('div', 'tray-empty', 'No .yml files found in data/.'));
    }
    state.files.forEach(function (f) {
      var r = el('button', 'filerow' + (f.isTemplate ? '' : ' cur'));
      // Which card it will open under — decided by the file's contents,
      // the same way a drop is.
      r.dataset.doc = f.doc;
      r.title = 'Load ' + f.name + ' into ' + (DOC_LABEL[f.doc] || f.doc);
      r.addEventListener('click', async function () {
        close();
        try {
          await api('POST', '/api/pick', { doc: f.doc, name: f.name });
          state.active = f.doc;
          await refreshStatus();
          renderAll();
          preview(f.doc);
          toast('Reading ' + f.name, 'nothing was copied or modified');
        } catch (err) {
          toast('Could not use it', err.message.slice(0, 80));
        }
      });
      r.appendChild(el('div', null,
        '<svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--muted-2)"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>'));
      var mid = el('div');
      mid.appendChild(el('div', 'n', esc(f.name)));
      mid.appendChild(el('div', 'd', esc(kb(f.bytes) + ' · ' + ago(f.mtimeMs))));
      r.appendChild(mid);
      r.appendChild(el('div', 'badge', f.isTemplate ? 'committed' : 'private'));
      body.appendChild(r);
    });
    modal.appendChild(body);

    var f = el('div', 'modal-f');
    f.appendChild(el('span', 'hint',
      'Click a file to read it. Studio never writes to these files.'));
    var closeBtn = el('button', 'btn tiny', 'Close');
    closeBtn.addEventListener('click', function () { close(); });
    f.appendChild(closeBtn);
    modal.appendChild(f);

    scrim.appendChild(modal);
    scrim.addEventListener('click', function (e) { if (e.target === scrim) close(); });
    close = openDialog(scrim, modal, title);
  }

  /**
   * Open the system file chooser for one document.
   *
   * A hidden <input type="file"> rather than drag-and-drop, because a
   * file input opens the native dialog in every context this app runs
   * in — an ordinary browser tab and the desktop window alike — while
   * HTML drag-and-drop depends on the host webview not intercepting the
   * drop first. Dropping is the nicety; this is the path that works.
   */
  function pickFile(doc) {
    var input = el('input');
    input.type = 'file';
    input.accept = '.yml,.yaml,text/yaml';
    input.style.display = 'none';
    document.body.appendChild(input);
    input.addEventListener('change', function () {
      var file = input.files && input.files[0];
      input.remove();
      // Same rule as a drop: what the file IS beats which card
      // you opened the dialog from.
      if (file) adoptFile(file, doc);
    });
    input.click();
  }

  /* ─── drag & drop import ───────────────────────────────────── */

  var dropEl = null, dropClose = null, dragDepth = 0;

  /**
   * The drop overlay. Two jobs, and normally only the first.
   *
   *   file == null   the "drop it here" prompt while a drag is over
   *                  the window.
   *   file != null   the fallback chooser, shown ONLY when the server
   *                  could not tell what the file is. It used to be
   *                  shown on every drop, guessing from the filename
   *                  and asking you to confirm the guess; the server
   *                  now reads the file instead, so this appears for
   *                  the genuinely undecidable case and nothing else.
   */
  function showDrop(file, why) {
    if (dropEl) return;
    dropEl = el('div', 'drop');
    var inner = el('div', 'drop-in');
    var heading = el('h2', 'drop-h',
      file ? 'Which document is this?' : 'Drop a .yml file');
    inner.appendChild(heading);
    inner.appendChild(el('div', 'drop-f', esc(file ? file.name : 'data/*.yml')));
    if (file && why) inner.appendChild(el('p', 'hint', esc(why)));

    var tg = el('div', 'targets');
    [['resume', 'Resume', 'Expects <code>sidebar:</code> and <code>mainColumn:</code>'],
     ['letter', 'Cover Letter', 'Expects <code>letter.body</code>']].forEach(function (t) {
      var b = el('button', 'target');
      b.appendChild(el('div', 'tn', t[1]));
      b.appendChild(el('div', 'td', t[2]));
      b.disabled = !file;
      b.addEventListener('click', function () { adoptFile(file, t[0], true); });
      tg.appendChild(b);
    });
    inner.appendChild(tg);
    inner.appendChild(el('p', 'hint',
      'Read straight away if it is already in <b>data/</b>, otherwise saved there under its own name. Nothing is ever replaced.'));
    if (file) {
      // Escape already closes it; this is the way out for a pointer.
      var cancel = el('button', 'btn tiny', 'Cancel');
      cancel.addEventListener('click', hideDrop);
      inner.appendChild(cancel);
      dropEl.addEventListener('click', function (e) { if (e.target === dropEl) hideDrop(); });
    }
    dropEl.appendChild(inner);
    dropEl.addEventListener('dragover', function (e) { e.preventDefault(); });
    dropEl.addEventListener('drop', function (e) { e.preventDefault(); });
    // The chooser is a question, so a dialog; the drag prompt is not.
    if (file) dropClose = openDialog(dropEl, inner, heading);
    else document.body.appendChild(dropEl);
  }
  function hideDrop() {
    if (!dropEl) return;
    if (dropClose) dropClose(); else dropEl.remove();
    dropEl = null; dropClose = null;
  }

  /**
   * Take a dropped file: save it into data/ under its own name, then
   * read it.
   *
   * A webview gives a dropped file's bytes but never its path, so there
   * is nowhere to read it from in place. It is written under its own
   * name and only if that name is free — an existing file is never
   * replaced, and the server refuses rather than overwriting.
   */
  async function adoptFile(file, doc, forced) {
    hideDrop();
    try {
      var content = await file.text();
      // `doc` is a fallback, not an instruction: the server reads the
      // file and its answer wins. Passing the card you dropped on only
      // matters if the contents cannot decide it.
      var r = await api('POST', '/api/adopt',
        { doc: doc || undefined, filename: file.name, content: content });

      doc = r.doc;

      if (r.conflict) {
        // Same name, different contents. Studio does not guess, and it
        // does not offer to replace — the choice is between what is on
        // disk and a new file beside it.
        askConflict(doc, file.name, content, r.suggestion);
        return;
      }

      var label = (docMeta(doc) && docMeta(doc).label) || doc;
      toast((r.existed ? 'Reading ' : 'Saved ') + file.name,
            forced ? label
                   : label + (r.detectedBy ? ' — ' + r.detectedBy : ''));
      state.active = doc;
      await refreshStatus();
      renderAll();
      preview(doc);
    } catch (err) {
      // The server refuses to guess when a file matches both shapes or
      // neither. That is a question, not a failure — fall back to the
      // chooser rather than making the drop a dead end.
      if (err.ambiguous) {
        showDrop(file, err.reason || err.message);
        return;
      }
      toast('Could not add that file', err.message.slice(0, 110));
    }
  }

  /** Same filename, different contents: let the user decide, briefly. */
  function askConflict(doc, name, content, suggestion) {
    var scrim = el('div', 'scrim');
    var modal = el('div', 'modal');
    var h = el('div', 'modal-h');
    var title = el('h3', null, 'data/' + esc(name) + ' already exists');
    h.appendChild(title);
    modal.appendChild(h);
    var close;

    var body = el('div', 'modal-b');
    body.appendChild(el('p', 'hint',
      'The file you dropped has the same name as one in <b>data/</b> but different contents. '
      + 'Studio will not replace it.'));
    modal.appendChild(body);

    var f = el('div', 'modal-f');
    var useExisting = el('button', 'btn tiny', 'Read data/' + esc(name));
    useExisting.addEventListener('click', async function () {
      close();
      try {
        await api('POST', '/api/pick', { doc: doc, name: name });
        state.active = doc;
        await refreshStatus(); renderAll(); preview(doc);
        toast('Reading data/' + name, 'the dropped copy was discarded');
      } catch (err) { toast('Could not read it', err.message.slice(0, 80)); }
    });
    var saveAs = el('button', 'btn tiny primary', 'Save as ' + esc(suggestion));
    saveAs.addEventListener('click', async function () {
      close();
      try {
        var r = await api('POST', '/api/adopt-as',
          { doc: doc, name: suggestion, content: content });
        state.active = doc;
        await refreshStatus(); renderAll(); preview(doc);
        toast('Saved ' + r.saved, 'now reading it');
      } catch (err) { toast('Could not save it', err.message.slice(0, 80)); }
    });
    var cancel = el('button', 'btn tiny', 'Cancel');
    cancel.addEventListener('click', function () { close(); });
    f.appendChild(cancel); f.appendChild(useExisting); f.appendChild(saveAs);
    modal.appendChild(f);

    scrim.appendChild(modal);
    scrim.addEventListener('click', function (e) { if (e.target === scrim) close(); });
    close = openDialog(scrim, modal, title);
  }

  window.addEventListener('dragenter', function (e) {
    e.preventDefault(); dragDepth++; showDrop(null);
  });
  window.addEventListener('dragover', function (e) { e.preventDefault(); });
  window.addEventListener('dragleave', function () {
    dragDepth--; if (dragDepth <= 0) { dragDepth = 0; hideDrop(); }
  });
  window.addEventListener('drop', function (e) {
    e.preventDefault(); dragDepth = 0; hideDrop();
    var file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (!file) return;
    if (!/\.ya?ml$/i.test(file.name)) {
      toast('Not a YAML file', file.name);
      return;
    }
    adoptFile(file, null);
  });
  window.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    // One layer per press. The drop overlay is always the top one, and
    // goes through hideDrop so the next drag can show it again.
    if (dropEl) hideDrop();
    else if (dialogs.length) dialogs[dialogs.length - 1]();
  });

  /* ─── keyboard shortcuts ───────────────────────────────────────
   *
   * One table, used both to act and to draw the help dialog (F1), so the
   * two cannot disagree. Letters and digits are matched on e.code — the
   * key's position — so Ctrl+8 is the same key on every layout, and
   * Ctrl+Shift+B is not undone by Shift changing e.key.
   *
   * Left alone on purpose: Ctrl+plus / minus / 0 (zoom the whole
   * interface; see "zoom"), Ctrl+F, Ctrl+P, Tab, and every key while an
   * IME is composing. Keys with no modifier act only where they cannot
   * be typing: never in an input, select or textarea.
   *
   * F5 and Ctrl+R are taken over everywhere, dialogs included: in the
   * desktop window they would otherwise reload the page — WebView2's
   * browser accelerator keys are on, and turning them off from the shell
   * needs the webview2-com crate as a direct dependency (see main.rs) —
   * and a reload throws away the preview and every render in memory.
   * Here they re-render, which is what a user pressing them wants.
   *
   * Documents are Ctrl+1 / Ctrl+2 first and Ctrl+Tab second: Chrome
   * keeps Ctrl+Tab for its own tab strip and never passes it to a page,
   * so in a browser tab (npm run ui) only the digits could work. The
   * browser may keep the digits too (Ctrl+1–8 pick its tabs, as it does
   * with Ctrl+8 and Ctrl+9); the document cards and the toolbar do the
   * same things.
   */
  var SHORTCUTS = [
    { keys: ['F5', 'Ctrl+R'], what: 'Re-render the preview',
      match: function (e, mod) { return e.key === 'F5' || (mod && e.code === 'KeyR'); },
      run: rerender },
    { keys: ['Ctrl+Shift+B'], what: 'Build the PDF of the document on screen',
      match: function (e, mod) { return mod && e.shiftKey && e.code === 'KeyB'; },
      run: function () { if (!(state.busy.resume || state.busy.letter)) doBuild(state.active); else say('A build or render is already running'); } },
    { keys: ['Ctrl+1', 'Ctrl+2'], what: 'Show the Resume, the Cover Letter',
      match: function (e, mod) {
        return mod && !e.shiftKey && (e.code === 'Digit1' || e.code === 'Digit2');
      },
      run: function (e) { showDoc(e.code === 'Digit1' ? 'resume' : 'letter'); } },
    { keys: ['Ctrl+Tab', 'Ctrl+Shift+Tab'], what: 'Switch between Resume and Cover Letter',
      match: function (e) { return e.ctrlKey && !e.altKey && e.key === 'Tab'; },
      run: function () { showDoc(state.active === 'resume' ? 'letter' : 'resume'); } },
    { keys: ['Ctrl+Shift+P'], what: 'Pause or resume auto-render',
      match: function (e, mod) { return mod && e.shiftKey && e.code === 'KeyP'; },
      run: function () { $('pauseBtn').click(); } },
    { keys: ['Ctrl+O'], what: 'Data files: choose which file to read',
      match: function (e, mod) { return mod && !e.shiftKey && e.code === 'KeyO'; },
      run: function () { openFiles(); } },
    { keys: ['Ctrl+Shift+D'], what: 'Show or hide Diagnostics',
      match: function (e, mod) { return mod && e.shiftKey && e.code === 'KeyD'; },
      run: toggleDiagnostics },
    { keys: ['Ctrl+Shift+L'], what: 'Theme: System, Light, Dark in turn',
      match: function (e, mod) { return mod && e.shiftKey && e.code === 'KeyL'; },
      run: function () { setTheme(THEMES[(THEMES.indexOf(prefs.theme) + 1) % THEMES.length], true); } },
    { keys: ['Ctrl+8'], what: 'Preview: fit width',
      match: function (e, mod) { return mod && !e.shiftKey && e.code === 'Digit8'; },
      run: function () { setZoom('width'); } },
    { keys: ['Ctrl+9'], what: 'Preview: fit page',
      match: function (e, mod) { return mod && !e.shiftKey && e.code === 'Digit9'; },
      run: function () { setZoom('page'); } },
    { keys: ['+', '−', '0'], what: 'Preview: zoom in, out, actual size (with the preview focused)',
      match: function (e, mod, typing) {
        return !mod && !e.altKey && !typing && inCanvas()
          && (e.key === '+' || e.key === '=' || e.key === '-' || e.code === 'Digit0' || e.code === 'Numpad0');
      },
      run: function (e) {
        if (e.key === '+' || e.key === '=') zoomStep(1);
        else if (e.key === '-') zoomStep(-1);
        else setZoom('none', 100);
      } },
    { keys: ['Ctrl+wheel'], what: 'Preview: zoom, over the pages (a pinch too)', match: null },
    { keys: ['F6', 'Shift+F6'], what: 'Move between Documents, Preview and Inspector',
      match: function (e) { return e.key === 'F6'; },
      run: function (e) { cyclePanes(e.shiftKey ? -1 : 1); } },
    { keys: ['F1', 'Ctrl+/'], what: 'This list',
      match: function (e, mod) { return e.key === 'F1' || (mod && e.code === 'Slash'); },
      run: function () { showHelp(); } },
    { keys: ['Ctrl+plus', 'Ctrl+minus', 'Ctrl+0'], what: 'Zoom the whole interface, text included', match: null },
    { keys: ['Esc'], what: 'Close a dialog', match: null },
  ];

  function showDoc(id) {
    if (!docMeta(id)) return;
    if (state.active !== id) select(id);
    say('Showing ' + docMeta(id).label);
  }

  function inCanvas() {
    var a = document.activeElement;
    return Boolean(a && a.closest && a.closest('.canvas'));
  }

  var PANES = ['rail', 'scroller', 'inspector'];
  function cyclePanes(dir) {
    var a = document.activeElement;
    var at = -1;
    PANES.forEach(function (p, i) { if (a && a.closest && a.closest('#' + p + (p === 'scroller' ? ', .canvas' : ''))) at = i; });
    var next = at === -1 ? (dir > 0 ? 0 : PANES.length - 1) : (at + dir + PANES.length) % PANES.length;
    $(PANES[next]).focus();
  }

  function toggleDiagnostics() {
    var det = $('diagDet');
    var open = !(det && det.open);
    state.diagAuto = false;
    savePrefs({ diagnostics: open });
    renderInspector();
    var again = $('diagDet');
    if (again && open) {
      again.scrollIntoView({ block: 'nearest' });
      again.querySelector('summary').focus();
    }
    say(open ? 'Diagnostics shown' : 'Diagnostics hidden');
  }

  function showHelp() {
    if ($('helpDlg')) return;
    var scrim = el('div', 'scrim');
    var modal = el('div', 'modal wide');
    modal.id = 'helpDlg';
    var h = el('div', 'modal-h');
    var title = el('h3', null, 'Keyboard shortcuts');
    h.appendChild(title);
    modal.appendChild(h);
    var body = el('div', 'modal-b');
    var table = el('table', 'keys');
    var cap = el('caption', 'sr-only', 'Keyboard shortcuts');
    table.appendChild(cap);
    var thead = el('thead', null, '<tr><th scope="col">Keys</th><th scope="col">Does</th></tr>');
    table.appendChild(thead);
    var tbody = el('tbody');
    SHORTCUTS.forEach(function (sc) {
      var tr = el('tr');
      tr.appendChild(el('td', null, sc.keys.map(function (k) {
        // A combination is written with its keys joined by "+"; the key
        // "+" itself (and "Ctrl+plus") is spelled so it cannot be split.
        var parts = k === '+' ? ['+'] : k.split('+');
        return parts.map(function (part) { return '<kbd>' + esc(part) + '</kbd>'; }).join('+');
      }).join(' or ')));
      tr.appendChild(el('td', null, esc(sc.what)));
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    body.appendChild(table);
    // It may scroll on a short window, so the keyboard must reach it.
    body.tabIndex = 0;
    body.setAttribute('role', 'region');
    body.setAttribute('aria-label', 'Shortcut list');
    body.appendChild(el('p', 'hint',
      'In a browser tab the browser keeps Ctrl+Tab for itself, and may keep Ctrl+1, Ctrl+2, Ctrl+8 and Ctrl+9; '
      + 'the document cards and the toolbar do the same things.'));
    modal.appendChild(body);
    var f = el('div', 'modal-f');
    var closeBtn = el('button', 'btn tiny', 'Close');
    f.appendChild(closeBtn);
    modal.appendChild(f);
    scrim.appendChild(modal);
    var close = openDialog(scrim, modal, title);
    closeBtn.addEventListener('click', function () { close(); });
    scrim.addEventListener('click', function (e) { if (e.target === scrim) close(); });
  }
  $('helpBtn').addEventListener('click', showHelp);

  window.addEventListener('keydown', function (e) {
    if (e.isComposing || e.keyCode === 229) return;
    // Not with Alt: on Windows, AltGr arrives as Ctrl+Alt, so AltGr+O
    // (ó on a Polish keyboard), AltGr+8 ([ on a German one) or AltGr+R
    // (® on US-International) would otherwise be Ctrl+O, Ctrl+8, Ctrl+R.
    var mod = (e.ctrlKey || e.metaKey) && !e.altKey;
    var t = e.target;
    var typing = Boolean(t && (/^(INPUT|SELECT|TEXTAREA)$/.test(t.tagName) || t.isContentEditable));
    // Never a reload: see above.
    var reload = e.key === 'F5' || (mod && e.code === 'KeyR');
    if (reload) e.preventDefault();
    // A dialog is open: it has the keyboard (Tab, Escape, its buttons).
    if (dialogs.length || dropEl) return;
    for (var i = 0; i < SHORTCUTS.length; i++) {
      var sc = SHORTCUTS[i];
      if (!sc.match || !sc.match(e, mod, typing)) continue;
      e.preventDefault();
      if (!e.repeat || sc.keys[0] === '+') sc.run(e);
      return;
    }
  });

  /* ─── server events ────────────────────────────────────────── */

  function connectEvents() {
    var es = new EventSource('/api/events');

    es.addEventListener('hello', function (ev) {
      clientId = JSON.parse(ev.data).client;
      reportVisibility();
    });

    es.addEventListener('log', function (ev) {
      var line = JSON.parse(ev.data).line;
      state.log.push(line);
      if (state.log.length > 500) state.log = state.log.slice(-400);
      var box = document.getElementById('logBox');
      if (box) {
        box.textContent = state.log.slice(-160).join('\n');
        box.scrollTop = box.scrollHeight;
      }
    });

    // A save in data/ or styles/ is the live-preview trigger. There is
    // no editor in this app on purpose — you keep using your own.
    es.addEventListener('changed', function () {
      if (state.paused) { state.missedChange = true; return; }
      var m = docMeta(state.active);
      if (!m || !m.live) return;
      preview(null, { fromChange: true });
    });

    // One page of a streaming render, as soon as the server has it. See
    // applyStreamedPage: events from a superseded render are dropped.
    es.addEventListener('page', function (ev) {
      var d = JSON.parse(ev.data);
      applyStreamedPage(d.doc, d.renderId, d.image);
    });

    es.addEventListener('render', function (ev) {
      var d = JSON.parse(ev.data);
      // This window's own render: preview() owns the busy state, and
      // ends it only once the reply is in state.render. Clearing it on
      // the event (which precedes the reply) redrew the previous render
      // over the streamed pages until the reply landed.
      if (streamRender[d.doc]) return;
      setBusy(d.doc, d.state === 'start' ? 'render' : null);
      renderCanvas();
      // A save seen while another window's render ran was deferred.
      if (d.state !== 'start') runPendingPreview();
    });

    var dropped = false;
    es.onerror = function () {
      dropped = true;
      $('envLine').textContent = 'disconnected from the engine';
    };
    // EventSource reconnects by itself. Saves made while it was down were
    // never announced, and the engine may be a new one: refresh and
    // render once, so neither the status line nor the pane stays stale.
    es.onopen = function () {
      if (!dropped) return;
      dropped = false;
      refreshStatusQuietly().then(function () {
        renderAll();
        if (state.paused) state.missedChange = true; else preview();
      });
    };
  }

  /* ─── boot ─────────────────────────────────────────────────── */

  (async function boot() {
    // Which editor "Open" will use, for its label. Not waited for.
    api('GET', '/api/open').then(function (r) {
      state.editor = r.editor === 'vscode' ? 'vscode' : 'default';
      renderCanvas();
    }).catch(function () { /* 'default' stands */ });
    // A page served without its settings (a server from before them, or
    // no server at all) asks once; failing that, localStorage stands.
    if (!prefsFromServer) {
      api('GET', '/api/prefs').then(function (r) {
        if (!r || !r.prefs) return;
        Object.assign(prefs, r.prefs);
        prefsFromServer = true;
        applyTheme(prefs.theme);
        state.snapshot = prefs.snapshot; state.tests = prefs.tests;
        state.zoom = prefs.zoom; state.fit = prefs.fit;
        $('hlBtn').setAttribute('aria-pressed', String(prefs.highlight));
        renderAll();
      }).catch(function () { /* localStorage stands */ });
    }
    try {
      await refreshStatus();
      connectEvents();
      sizeSheets();
      renderAll();
      await preview('resume');
    } catch (err) {
      // renderAll() may already have replaced #placeholder.
      $('scroller').textContent = 'Could not reach the engine: ' + err.message;
    }
  })();
})();
</script>

</body>
</html>
