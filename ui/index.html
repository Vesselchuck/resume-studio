<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Resume Studio</title>
<style>
/* The project's own variable fonts, served by studio_server.js from
   fonts/variable/. Fetching them from Google Fonts held first paint on a
   render-blocking stylesheet, failed offline, and told Google each time
   the Studio was opened. */
@font-face{font-family:'Manrope';src:url('/fonts/variable/Manrope.woff2') format('woff2');
  font-weight:200 800;font-style:normal;font-display:swap}
@font-face{font-family:'Newsreader';src:url('/fonts/variable/Newsreader.woff2') format('woff2');
  font-weight:200 800;font-style:normal;font-display:swap}
:root{
  --ground:#e4e7e1;
  --chrome:#f3f4f0;
  --panel:#ffffff;
  --panel-2:#eceee8;
  --rule:#d5d9cf;
  --rule-soft:#e3e6de;
  --ink:#15181a;
  --muted:#5d645d;
  --muted-2:#626862;
  --accent:#2d4a3e;
  --accent-ink:#ffffff;
  --accent-wash:#e2eae5;
  --warn:#8a6112;
  --warn-wash:#f4ecd8;
  --err:#9d382a;
  --err-wash:#f6e3df;
  --paper:#ffffff;
  /* Drawn on the paper, which is white in both themes: one colour, dark
     enough on white (7.9:1), whatever the chrome around it is. */
  --change:#1f6f4a;
  --paper-shadow:0 1px 2px rgba(20,30,20,.10), 0 8px 24px rgba(20,30,20,.10);
  --titlebar:#dfe3db;
  --radius:9px;
  --mono:ui-monospace,'Cascadia Mono','SF Mono',Consolas,monospace;
  --ui:'Manrope','Helvetica Neue',Arial,sans-serif;
  --display:'Newsreader',Georgia,'Times New Roman',serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#111512;
    --chrome:#1a1e1b;
    --panel:#21261f;
    --panel-2:#1b201a;
    --rule:#333a31;
    --rule-soft:#2a3028;
    --ink:#e7eae4;
    --muted:#9aa398;
    --muted-2:#868e84;
    --accent:#7fb497;
    --accent-ink:#10231a;
    --accent-wash:#22332a;
    --warn:#d9ac5b;
    --warn-wash:#33290f;
    --err:#e08b7c;
    --err-wash:#3a1f1a;
    --titlebar:#161a16;
    --paper-shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 30px rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#111512;
  --chrome:#1a1e1b;
  --panel:#21261f;
  --panel-2:#1b201a;
  --rule:#333a31;
  --rule-soft:#2a3028;
  --ink:#e7eae4;
  --muted:#9aa398;
  --muted-2:#868e84;
  --accent:#7fb497;
  --accent-ink:#10231a;
  --accent-wash:#22332a;
  --warn:#d9ac5b;
  --warn-wash:#33290f;
  --err:#e08b7c;
  --err-wash:#3a1f1a;
  --titlebar:#161a16;
  --paper-shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 30px rgba(0,0,0,.45);
  color-scheme:dark;
}

/* The UA stylesheet's [hidden]{display:none} loses to any author rule
   that sets `display`, and .holdbar sets display:flex. Without this the
   hold bar is permanently visible showing its placeholder text, which
   is exactly as confusing as it sounds. */
[hidden]{display:none !important}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:var(--ground);
  color:var(--ink);
  font-family:var(--ui);
  font-size:13px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){*,::before,::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}}
/* Read by screen readers, not shown. */
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* ---------- window shell ---------- */
.shell{
  height:100%;
  display:flex;
  flex-direction:column;
  background:var(--chrome);
  overflow:hidden;
}

.iconbtn{
  background:transparent;border:1px solid transparent;border-radius:7px;
  width:28px;height:26px;display:grid;place-items:center;color:var(--muted);
}
.iconbtn:hover{background:var(--panel);border-color:var(--rule);color:var(--ink)}

/* menubar — now the topmost strip, so it carries the safe-area inset */
.menubar{
  flex:none;display:flex;gap:2px;align-items:center;
  padding:0 8px 0 10px;
  padding-top:env(safe-area-inset-top,0px);
  height:calc(34px + env(safe-area-inset-top,0px));
  background:var(--chrome);border-bottom:1px solid var(--rule);
  font-size:12px;color:var(--muted);
  user-select:none;
}
.menubar .iconbtn{width:26px;height:24px;flex:none;margin-left:6px}
/* Buttons that look like menu words. */
.menubar .menu{background:none;border:0;color:inherit;font-size:inherit;padding:3px 9px;border-radius:6px}
.menubar .menu:hover{background:var(--panel-2);color:var(--ink)}
.menubar .spacer{flex:1;background:none}
.menubar .env{
  font-family:var(--mono);font-size:10.5px;color:var(--muted-2);
  letter-spacing:.02em;padding-right:2px;
}
/* Theme: a radio group (System / Light / Dark), per the APG pattern. */
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:7px;overflow:hidden;margin-left:8px;background:var(--panel)}
.seg button{background:none;border:0;border-right:1px solid var(--rule-soft);padding:3px 9px;font-size:11px;color:var(--muted)}
.seg button:last-child{border-right:0}
.seg button:hover{color:var(--ink);background:var(--panel-2)}
.seg button[aria-checked="true"]{background:var(--accent-wash);color:var(--ink);font-weight:700}
.seg button:focus-visible{outline-offset:-2px}

/* ---------- 3-pane grid ---------- */
.panes{
  flex:1;min-height:0;
  display:grid;
  grid-template-columns:272px minmax(0,1fr) 340px;
}
.rail,.inspector{background:var(--chrome);min-height:0;overflow-y:auto}
.rail{border-right:1px solid var(--rule);padding:14px 12px 20px}
.inspector{border-left:1px solid var(--rule);padding:14px 14px 22px}
.canvas{background:var(--ground);min-height:0;display:flex;flex-direction:column;position:relative}

.eyebrow{
  font-size:10px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;
  color:var(--muted-2);margin:0 0 9px;
}

/* ---------- document cards ---------- */
.doclist{display:flex;flex-direction:column;gap:10px}
.doc{
  background:var(--panel);
  border:1px solid var(--rule);
  border-radius:var(--radius);
  padding:12px 12px 11px;
  display:flex;flex-direction:column;gap:9px;
  text-align:left;width:100%;
  transition:border-color .15s, box-shadow .15s;
  position:relative;
}
.doc.is-active{border-color:var(--accent);outline:1px solid var(--accent)}
.doc-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
/* The card's name is the button that selects it: the card is clickable
   anywhere, and this is the same action for the keyboard. */
.doc-pick{background:none;border:0;padding:0;font:inherit;color:inherit;text-align:left}
.doc-name{
  font-family:var(--display);font-size:17px;font-weight:500;letter-spacing:.005em;
  margin:0;line-height:1.15;
}
.doc-kind{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted-2);font-weight:700}
.doc-src{
  font-family:var(--mono);font-size:10.5px;color:var(--muted);
  display:flex;align-items:center;gap:5px;word-break:break-all;
}
.doc-src svg{flex:none;color:var(--muted-2)}
.doc-src .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.doc-src.missing{color:var(--err)}
.doc-src.missing svg{color:var(--err)}
.doc-src .miss{flex:none;font-family:var(--ui);font-weight:700}

.status{
  display:inline-flex;align-items:center;gap:6px;
  font-size:11px;font-weight:600;letter-spacing:.01em;
  padding:2.5px 8px 2.5px 6px;border-radius:999px;
  border:1px solid transparent;
}
.status i{width:6px;height:6px;border-radius:50%;border:3px solid currentColor;flex:none}
/* Not colour alone (1.4.1): failed is a diamond, idle a ring. Borders, not
   backgrounds, so the marks survive forced colors (backgrounds go to Canvas). */
.status.err i{border-radius:1px;transform:rotate(45deg);width:7px;height:7px;border-width:3.5px}
.status.idle i{border-width:1.5px}
.status.ok{color:var(--accent);background:var(--accent-wash);border-color:color-mix(in srgb,var(--accent) 22%, transparent)}
.status.warn{color:var(--warn);background:var(--warn-wash);border-color:color-mix(in srgb,var(--warn) 25%, transparent)}
.status.err{color:var(--err);background:var(--err-wash);border-color:color-mix(in srgb,var(--err) 25%, transparent)}
.status.idle{color:var(--muted);background:var(--panel-2);border-color:var(--rule-soft)}
.status.run i{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

.doc-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{
  font-size:11px;color:var(--muted);background:var(--panel-2);
  border:1px solid var(--rule-soft);border-radius:6px;padding:2px 7px;
  font-variant-numeric:tabular-nums;
}

.btn{
  border:1px solid var(--rule);background:var(--panel);
  border-radius:7px;padding:7px 11px;font-size:12px;font-weight:600;
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  transition:background .12s,border-color .12s;
}
.btn:hover{background:var(--panel-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.primary[disabled],.btn.primary[aria-disabled="true"]{opacity:.45;cursor:not-allowed;filter:none}
.btn.wide{width:100%}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted);padding:5px 7px}
.btn.ghost:hover{background:var(--panel-2);color:var(--ink)}
.btn.tiny{padding:4px 8px;font-size:11px;font-weight:500}
.btn.ghost[aria-pressed="true"]{background:var(--panel-2);border-color:var(--rule);color:var(--ink)}
.btn.ghost[aria-disabled="true"]{opacity:.4;cursor:default}
.doc-actions{display:flex;gap:7px}
.doc-actions .btn.primary{flex:1}

/* progress inside a card: indeterminate. A build does not report how
   far along it is, so a bar that stood at 60% was a guess dressed as a
   measurement; this one says only "working". */
.track{height:3px;border-radius:2px;background:var(--rule-soft);overflow:hidden;position:relative}
.track span{position:absolute;top:0;bottom:0;left:0;width:35%;background:var(--accent);animation:indet 1.3s ease-in-out infinite}
@keyframes indet{from{transform:translateX(-100%)}to{transform:translateX(290%)}}
@media (prefers-reduced-motion: reduce){.track span{animation:none;width:100%;opacity:.55}}

/* outputs tray */
.tray{display:flex;flex-direction:column;gap:1px;border-top:1px solid var(--rule-soft);padding-top:9px}
.tray-row{
  display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;
  padding:5px 4px;border-radius:6px;
}
.tray-row:hover{background:var(--panel-2)}
.tray-row.absent .f{color:var(--muted-2)}
.doc-opt{
  display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--muted);
  padding:2px 2px 0;cursor:pointer;
}
.doc-opt input{accent-color:var(--accent);width:13px;height:13px;margin:0;cursor:pointer}
.doc-opt:hover{color:var(--ink)}
button.s{background:none;border:0;padding:0;font:inherit;text-align:right}
.tray-row .s.link{cursor:pointer;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:2px}
.tray-row .s.link:hover{color:var(--accent)}
/* Was monospace with path-ellipsis, because it held the output's
   filename. It holds a plain label now, so it takes the UI font —
   mono is for paths and numbers, not for words. The path moved to the
   row's tooltip. */
.tray-row .f{font-size:11.5px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tray-row .s{font-size:10.5px;color:var(--muted-2);font-variant-numeric:tabular-nums}
.tray-empty{font-size:11.5px;color:var(--muted-2);padding:4px 2px 2px}

.rail-foot{margin-top:16px;display:flex;flex-direction:column;gap:7px}
.hint{font-size:11px;color:var(--muted-2);line-height:1.5}
.sep{height:1px;background:var(--rule-soft);margin:14px 0}

/* ---------- canvas ---------- */
.canvas-bar{
  flex:none;display:flex;align-items:center;gap:10px;
  padding:8px 14px;border-bottom:1px solid var(--rule);
  background:color-mix(in srgb,var(--chrome) 70%, transparent);
  backdrop-filter:blur(6px);
}
.canvas-title{font-family:var(--display);font-size:13.5px;color:var(--muted)}
.canvas-title b{color:var(--ink);font-weight:600}
.canvas-tools{margin-left:auto;display:flex;align-items:center;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.canvas-tools .tsep{width:1px;height:16px;background:var(--rule);margin:0 4px}
.zoom{font-family:var(--mono);font-size:11px;color:var(--muted);min-width:42px;text-align:center;font-variant-numeric:tabular-nums}
.stale{
  font-size:11px;color:var(--warn);background:var(--warn-wash);
  border:1px solid color-mix(in srgb,var(--warn) 25%, transparent);
  padding:2px 8px;border-radius:999px;font-weight:600;
}
.liveflag{
  display:inline-flex;align-items:center;gap:6px;
  font-size:11px;font-weight:600;color:var(--accent);
  background:var(--accent-wash);border:1px solid color-mix(in srgb,var(--accent) 22%, transparent);
  padding:2.5px 9px;border-radius:999px;
}
.liveflag i{width:6px;height:6px;border-radius:50%;border:3px solid currentColor;flex:none}
.liveflag.paused i{border-width:1.5px}
.liveflag.busy i{animation:pulse .6s ease-in-out infinite}
.liveflag.paused{color:var(--muted);background:var(--panel-2);border-color:var(--rule-soft)}
.liveflag .ms{font-family:var(--mono);font-weight:500;font-variant-numeric:tabular-nums}

/* A render that failed, shown where you are looking: on top of the
   preview, which stays underneath dimmed as the last good render. It
   stays until the next render succeeds — it is state, not news, so
   not a toast. Where the error is comes first, because that is where
   you go next. */
.erroverlay{
  flex:none;margin:12px 16px 0;padding:10px 12px;
  border:1px solid color-mix(in srgb,var(--err) 40%, transparent);border-left-width:4px;
  background:var(--err-wash);border-radius:var(--radius);
  box-shadow:0 6px 18px rgba(0,0,0,.10);
  display:flex;flex-direction:column;gap:6px;
}
.erroverlay.notice{border-color:color-mix(in srgb,var(--warn) 45%, transparent);background:var(--warn-wash)}
.eo-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.eo-kind{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--err)}
.erroverlay.notice .eo-kind{color:var(--warn)}
.eo-loc{font-family:var(--mono);font-size:12.5px;font-weight:600;color:var(--ink);word-break:break-all}
.eo-msg{font-size:12.5px;color:var(--ink);line-height:1.5;white-space:pre-wrap;word-break:break-word;max-height:9em;overflow:auto}
.eo-foot{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.eo-held{font-size:11px;color:var(--muted)}
.eo-foot .spacer{flex:1}

/* re-render shimmer */
.sheet{position:relative}
.sheet.rendering::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(105deg,transparent 38%,rgba(45,74,62,.10) 50%,transparent 62%);
  background-size:280% 100%;
  animation:sweep .62s ease-out;
}
@keyframes sweep{from{background-position:180% 0}to{background-position:-80% 0}}
.sheet.held{opacity:.55;filter:saturate(.55)}
/* Changed since the last render: outlined, then faded over 4 s. */
.chg{position:absolute;pointer-events:none;outline:2px solid var(--change);outline-offset:1px;border-radius:2px;
  background:color-mix(in srgb,var(--change) 7%, transparent);animation:chgfade 4s ease-in forwards}
@keyframes chgfade{0%,35%{opacity:1}to{opacity:0}}
@media (prefers-reduced-motion: reduce){.chg{animation:none !important}}
/* Pages flow left to right and wrap, so a wide window shows a spread
   rather than one page with empty gutters either side. align-content
   keeps wrapped rows packed at the top instead of spread down the
   scroll area. */
.scroller{
  flex:1;min-height:0;overflow:auto;padding:22px 20px 40px;
  display:flex;flex-flow:row wrap;
  /* `safe`: a page zoomed wider than the pane starts at its left edge
     and scrolls, instead of overflowing both ways with its left half
     out of reach. */
  justify-content:safe center;align-items:flex-start;align-content:flex-start;
  gap:24px 22px;
}

.sheet-wrap{flex:0 0 auto;display:flex;flex-direction:column;gap:7px}
.sheet{
  background:var(--paper);color:#1a1a1a;
  aspect-ratio:8.5/11;max-width:100%;
  box-shadow:var(--paper-shadow);
  border-radius:2px;
  padding:5.8% 5.8%;
  display:flex;flex-direction:column;
  overflow:hidden;
  container-type:inline-size;
}
.sheet-label{display:flex;justify-content:space-between;align-items:center;font-size:10.5px;color:var(--muted-2)}
.budget{display:flex;align-items:center;gap:7px;font-variant-numeric:tabular-nums}
.budget .bar{width:74px;height:4px;border-radius:2px;background:var(--rule-soft);overflow:hidden}
.budget .bar span{display:block;height:100%;background:var(--accent)}

/* ---------- inspector ---------- */
.ins-group{margin-bottom:18px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:9px}
.field label{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted-2)}
.field input,.field select,.field textarea{
  font:inherit;font-size:12px;color:var(--ink);
  background:var(--panel);border:1px solid var(--rule);border-radius:6px;
  padding:6px 8px;width:100%;
}
.field textarea{resize:vertical;min-height:52px;line-height:1.45}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);outline:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}

.srcbox{
  background:var(--panel);border:1px solid var(--rule);border-radius:var(--radius);
  padding:10px;display:flex;flex-direction:column;gap:8px;
}
.srcbox .path{font-family:var(--mono);font-size:11px;word-break:break-all;color:var(--ink)}
.srcbox .note{font-size:11px;color:var(--muted)}
.srcbox .row{display:flex;gap:7px}
.srcbox select{
  font:inherit;font-size:12px;color:var(--ink);background:var(--panel);
  border:1px solid var(--rule);border-radius:6px;padding:6px 8px;width:100%;
}
.srcbox select:focus{border-color:var(--accent);outline:none}
.srcbox select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.checks{display:flex;flex-direction:column;gap:7px}
.check{display:flex;align-items:center;gap:9px;padding:7px 9px;border:1px solid var(--rule);border-radius:7px;background:var(--panel);cursor:pointer}
.check input{accent-color:var(--accent);width:14px;height:14px;margin:0}
.check .t{font-size:12px;font-weight:600}
.check .d{font-size:10.5px;color:var(--muted-2);font-family:var(--mono)}
.check.off{opacity:.55}

/* phase stepper */
.phases{display:flex;flex-direction:column;gap:0;border:1px solid var(--rule);border-radius:var(--radius);background:var(--panel);overflow:hidden}
.phase{display:grid;grid-template-columns:18px 1fr auto;gap:9px;align-items:center;padding:6px 10px;font-size:11.5px;border-bottom:1px solid var(--rule-soft)}
.phase:last-child{border-bottom:0}
.phase .m{display:grid;place-items:center;width:16px;height:16px;border-radius:50%;border:1.5px solid var(--rule);color:transparent;font-size:9px;font-weight:800}
.phase.done .m{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.phase.run .m{border-color:var(--accent);border-right-color:transparent;animation:spin .7s linear infinite}
.phase.todo{color:var(--muted-2)}
.phase .ms{font-family:var(--mono);font-size:10px;color:var(--muted-2);font-variant-numeric:tabular-nums}
@keyframes spin{to{transform:rotate(360deg)}}

.log{
  background:var(--panel-2);border:1px solid var(--rule);border-radius:var(--radius);
  font-family:var(--mono);font-size:10.5px;line-height:1.65;
  padding:9px 10px;max-height:150px;overflow:auto;color:var(--muted);
  white-space:pre-wrap;word-break:break-word;
}
.log b{color:var(--ink);font-weight:500}
details>summary{cursor:pointer;font-size:11px;color:var(--muted);list-style:none;display:flex;align-items:center;gap:6px;padding:4px 0}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"▸" / "";font-size:9px;color:var(--muted-2)}
details[open]>summary::before{content:"▾" / ""}

/* error card */
.errcard{
  border:1px solid color-mix(in srgb,var(--err) 30%, transparent);
  background:var(--err-wash);border-radius:var(--radius);
  padding:10px;display:flex;flex-direction:column;gap:7px;
}
.errcard .loc{font-family:var(--mono);font-size:10.5px;color:var(--err);font-weight:500}
.errcard .msg{font-size:12px;color:var(--ink);line-height:1.5}
.errcard .fix{font-size:11.5px;color:var(--muted)}
.errcard.notice{
  background:var(--warn-wash);
  border-color:color-mix(in srgb,var(--warn) 30%, transparent);
}
.errcard.notice .loc{color:var(--warn)}

/* ---------- drop overlay ---------- */
.drop{
  position:fixed;inset:0;z-index:60;
  background:color-mix(in srgb,var(--ground) 82%, transparent);
  backdrop-filter:blur(3px);
  display:grid;place-items:center;padding:24px;
}
.drop-in{width:100%;max-width:620px;display:flex;flex-direction:column;gap:14px;text-align:center}
.drop-h{font-family:var(--display);font-size:22px;margin:0}
.drop-f{font-family:var(--mono);font-size:12px;color:var(--muted)}
.targets{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.target{
  border:1.5px dashed var(--rule);border-radius:12px;background:var(--panel);
  padding:22px 16px;display:flex;flex-direction:column;gap:6px;align-items:center;
  transition:border-color .12s,background .12s,transform .12s;
}
.target:hover,.target.suggest{border-color:var(--accent);background:var(--accent-wash)}
.target.suggest{border-style:solid}
.target .tn{font-family:var(--display);font-size:16px;font-weight:600}
.target .td{font-size:11px;color:var(--muted)}
.target .tag{font-size:9.5px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:var(--accent)}

/* ---------- modal (open dialog) ---------- */
.scrim{position:fixed;inset:0;z-index:70;background:rgba(10,14,10,.42);display:grid;place-items:center;padding:20px}
.modal{
  width:100%;max-width:480px;background:var(--panel);border:1px solid var(--rule);
  border-radius:12px;box-shadow:0 18px 50px rgba(0,0,0,.28);overflow:hidden;
}
.modal h3{font-family:var(--display);font-size:16px;margin:0;font-weight:600}
.modal-h{padding:13px 15px;border-bottom:1px solid var(--rule-soft);display:flex;align-items:center;justify-content:space-between;gap:10px}
.modal-b{padding:8px 8px;max-height:52vh;overflow:auto}
.modal-f{padding:11px 15px;border-top:1px solid var(--rule-soft);display:flex;justify-content:flex-end;gap:8px;background:var(--panel-2)}
.filerow{
  width:100%;text-align:left;display:grid;grid-template-columns:16px 1fr auto;gap:10px;align-items:center;
  padding:8px 9px;border-radius:7px;border:1px solid transparent;background:transparent;
}
.filerow:hover{background:var(--panel-2);border-color:var(--rule-soft)}
.filerow .n{font-family:var(--mono);font-size:11.5px}
.filerow .d{font-size:10.5px;color:var(--muted-2)}
.filerow .badge{font-size:9.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted-2)}
.filerow.cur .badge{color:var(--accent)}

/* toast */
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{
  background:var(--ink);color:var(--ground);
  border-radius:8px;padding:9px 14px;font-size:12px;font-weight:600;
  box-shadow:0 8px 24px rgba(0,0,0,.3);
  display:flex;align-items:center;gap:9px;
  animation:rise .22s ease-out;
}
.toast .sub{font-weight:500;opacity:.72}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}

/* annotations */
.note-pill{
  position:absolute;z-index:5;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  background:var(--ink);color:var(--ground);border-radius:5px;padding:3px 7px;opacity:.85;
}

/* keyboard shortcuts */
.keys{width:100%;border-collapse:collapse;font-size:12px}
.keys th{text-align:left;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted-2);padding:10px 8px 4px}
.keys td{padding:5px 8px;border-top:1px solid var(--rule-soft);vertical-align:top}
.keys td:first-child{white-space:nowrap;width:1%}
kbd{font-family:var(--mono);font-size:10.5px;padding:1px 5px;border:1px solid var(--rule);border-bottom-width:2px;border-radius:4px;background:var(--panel-2);color:var(--ink)}
.modal.wide{max-width:600px}
.modal.wide .modal-b{max-height:72vh}
.empty-act{margin-top:12px}
.diag-env{font-family:var(--mono);font-size:10.5px;color:var(--muted);overflow-wrap:anywhere;margin:6px 0 10px}
details.diag>summary{font-size:10px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--muted-2)}
details.diag[open]>summary{margin-bottom:6px}
.diag .eyebrow{margin-top:10px}

/* ---------- narrow ---------- */
@media (max-width: 980px){
  html,body{height:auto}
  .shell{height:auto;min-height:100%}
  .panes{grid-template-columns:1fr}
  .rail,.inspector{border:0;border-bottom:1px solid var(--rule);overflow:visible}
  .canvas{min-height:70vh}
  .scroller{padding:18px 16px 30px}
  .targets{grid-template-columns:1fr}
}

/* Windows High Contrast / forced colors. Backgrounds and box-shadows are
   dropped there, so anything drawn only with them needs a border or outline. */
@media (forced-colors: active){
  .sheet{outline:1px solid CanvasText}
  .btn.ghost[aria-pressed="true"]{forced-color-adjust:none;background:Highlight;color:HighlightText;border-color:Highlight}
  .track{border:1px solid CanvasText}
  .track span{forced-color-adjust:none;background:Highlight}
  .chg{forced-color-adjust:none;outline-color:Highlight;background:transparent}
  .seg button[aria-checked="true"]{forced-color-adjust:none;background:Highlight;color:HighlightText}
  .erroverlay{border-color:CanvasText}
  /* The primary buttons in system colours, inverted so they still stand
     out. Left to the browser, their text kept the dark accent ink on a
     forced black background in a dark high-contrast theme (1.27:1). */
  .btn.primary{forced-color-adjust:none;background:ButtonText;color:ButtonFace;border-color:ButtonText}
}

/* rasterized PDF pages */
.sheet{padding:0;display:block;aspect-ratio:auto;container-type:normal}
.sheet img{display:block;width:100%;height:auto;border-radius:2px}
.placeholder{
  margin:auto;color:var(--muted-2);font-size:13px;text-align:center;
  padding:40px 20px;max-width:340px;line-height:1.6;
}

.target[disabled]{opacity:.45;cursor:not-allowed}
.log{max-height:190px}
</style>
</head>
<body>
<div class="shell">

  <header class="menubar">
    <h1 class="sr-only">Resume Studio</h1>
    <button class="menu" id="menuRefresh" title="Render the preview again (F5 or Ctrl+R)" aria-keyshortcuts="F5 Control+R">Re-render</button>
    <button class="menu" id="menuOpenDist" title="Show dist/, where Build writes the PDFs, in your file manager">Show output folder</button>
    <div class="spacer"></div>
    <div class="env" id="envLine" title="The engine: open Diagnostics in the Inspector (Ctrl+Shift+D) for details">starting…</div>
    <div class="seg" id="themeGroup" role="radiogroup" aria-label="Theme" title="Theme (Ctrl+Shift+L to cycle)">
      <button type="button" role="radio" data-theme-choice="system" aria-checked="true">System</button>
      <button type="button" role="radio" data-theme-choice="light" aria-checked="false" tabindex="-1">Light</button>
      <button type="button" role="radio" data-theme-choice="dark" aria-checked="false" tabindex="-1">Dark</button>
    </div>
    <button class="iconbtn" id="helpBtn" title="Keyboard shortcuts (F1)" aria-label="Keyboard shortcuts" aria-keyshortcuts="F1 Control+/">
      <svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></svg>
    </button>
  </header>

  <div class="panes">

    <aside class="rail" id="rail" aria-label="Documents" tabindex="-1">
      <p class="eyebrow">Documents</p>
      <div class="doclist" id="docList"></div>

      <div class="rail-foot">
        <button class="btn wide" id="openDlg" title="Choose which file in data/ to read (Ctrl+O)" aria-keyshortcuts="Control+O">
          <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h6l2 2h10v9a2 2 0 0 1-2 2H3z"/></svg>
          Data files…
        </button>
        <p class="hint">Edit your YAML in your own editor — Studio watches <b>data/</b> and <b>styles/</b> and re-renders the PDF when you save. Drop a <b>.yml</b> on the window to load a different one.</p>
      </div>
    </aside>

    <main class="canvas">
      <div class="canvas-bar">
        <div class="canvas-title"><b id="canvasDoc">Resume</b> <span style="color:var(--muted-2)" id="canvasMode">· printed PDF</span></div>
        <span class="liveflag" id="liveFlag" role="status"><i></i><span id="liveText" aria-hidden="true">Live</span><span class="ms" id="liveMs" aria-hidden="true">—</span><span class="sr-only" id="liveSay"></span></span>
        <div class="canvas-tools">
          <button class="btn ghost tiny" id="hlBtn" aria-pressed="true" title="Outline what changed after each render">Highlight changes</button>
          <button class="btn ghost tiny" id="pauseBtn" aria-pressed="false" title="Pause auto-render (Ctrl+Shift+P)" aria-keyshortcuts="Control+Shift+P">Pause</button>
          <span class="tsep" aria-hidden="true"></span>
          <button class="btn ghost tiny" id="zoomOut" aria-label="Zoom out" title="Zoom out (− with the preview focused, or Ctrl+wheel over the pages)">−</button>
          <span class="zoom" id="zoomVal" role="status">100%</span>
          <button class="btn ghost tiny" id="zoomIn" aria-label="Zoom in" title="Zoom in (+ with the preview focused, or Ctrl+wheel over the pages)">+</button>
          <button class="btn ghost tiny" id="zoom100" aria-pressed="false" title="Actual size: 8.5 inches wide (0 with the preview focused)">100%</button>
          <button class="btn ghost tiny" id="fitWidth" aria-pressed="false" title="Fit the page to the width of the pane (Ctrl+8)" aria-keyshortcuts="Control+8">Fit width</button>
          <button class="btn ghost tiny" id="fitPage" aria-pressed="false" title="Fit a whole page in the pane (Ctrl+9)" aria-keyshortcuts="Control+9">Fit page</button>
        </div>
      </div>
      <div class="erroverlay" id="errOverlay" role="group" aria-labelledby="eoKind" hidden>
        <div class="eo-head"><span class="eo-kind" id="eoKind">Render failed</span><code class="eo-loc" id="eoLoc"></code></div>
        <div class="eo-msg" id="eoMsg"></div>
        <div class="eo-foot">
          <span class="eo-held" id="eoHeld"></span>
          <span class="spacer"></span>
          <button class="btn tiny" id="eoCopy" type="button">Copy location</button>
          <button class="btn tiny primary" id="eoOpen" type="button">Open in editor</button>
        </div>
      </div>
      <div class="scroller" id="scroller" tabindex="0" role="region" aria-label="Preview pages">
        <div class="placeholder" id="placeholder">Starting the engine…</div>
      </div>
    </main>

    <aside class="inspector" id="inspector" aria-label="Inspector" tabindex="-1"></aside>
  </div>
</div>

<div class="toasts" id="toasts" role="status"></div>
<!-- Read by screen readers only. `say` is for news that has no visible
     text of its own (a theme change, a copied location); `alertSay`
     carries a render failure, set only when the failure changes. -->
<div class="sr-only" id="say" role="status" aria-live="polite"></div>
<div class="sr-only" id="alertSay" role="alert"></div>

<script>
(function () {
  "use strict";

  /* ─── tiny helpers ─────────────────────────────────────────── */

  var root = document.documentElement;
  function $(id) { return document.getElementById(id); }
  // `html` is inserted as markup. Anything that did not come from this
  // file — a file name, a server message, YAML content — must go through
  // esc() first.
  function el(tag, cls, html) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (html != null) n.innerHTML = html;
    return n;
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (ch) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch];
    });
  }
  function kb(bytes) {
    if (!bytes && bytes !== 0) return '—';
    return bytes >= 1024 * 1024
      ? (bytes / 1024 / 1024).toFixed(1) + ' MB'
      : Math.round(bytes / 1024) + ' KB';
  }
  function ago(ms) {
    if (!ms) return 'never';
    var s = Math.round((Date.now() - ms) / 1000);
    if (s < 60) return s + 's ago';
    if (s < 3600) return Math.round(s / 60) + 'm ago';
    if (s < 86400) return Math.round(s / 3600) + 'h ago';
    return new Date(ms).toLocaleDateString();
  }
  // A wall-clock time, "14:02", for "Showing last good render · 14:02".
  function clock(ms) {
    return new Date(ms).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }
  // Tell a screen reader something that has no visible announcement of
  // its own. Cleared first so the same words twice are read twice.
  function say(text) {
    var n = $('say');
    n.textContent = '';
    setTimeout(function () { n.textContent = text; }, 30);
  }
  function toast(main, sub) {
    var t = el('div', 'toast', '<span>' + esc(main) + '</span>' +
      (sub ? '<span class="sub">' + esc(sub) + '</span>' : ''));
    $('toasts').appendChild(t);
    setTimeout(function () {
      t.style.transition = 'opacity .3s'; t.style.opacity = '0';
      setTimeout(function () { t.remove(); }, 320);
    }, 3600);
  }

  async function api(method, route, body) {
    // Every POST is JSON, body or not: the server refuses any other
    // content type, which is what keeps a form on some other web page
    // from posting to it.
    if ((method === 'POST' || method === 'PUT') && !body) body = {};
    var res = await fetch(route, {
      method: method,
      headers: body ? { 'content-type': 'application/json' } : undefined,
      body: body ? JSON.stringify(body) : undefined,
    });
    var data = await res.json().catch(function () { return {}; });
    if (!res.ok) {
      var e = new Error(data.error || (method + ' ' + route + ' failed'));
      e.failures = data.failures || [];
      // Carried so a caller can tell a refusal apart from a failure:
      // /api/adopt sets `ambiguous` when it declines to guess which
      // document a dropped file is, and the caller answers that by
      // asking rather than by giving up.
      e.ambiguous = data.ambiguous || false;
      e.reason = data.reason || '';
      throw e;
    }
    return data;
  }

  /* ─── state ────────────────────────────────────────────────── */

  /* ─── preferences ──────────────────────────────────────────────
   *
   * Kept by the server (GET/PUT /api/prefs, in dist/.studio-prefs.json),
   * not in localStorage alone: the desktop app's page is served from a
   * new port — a new origin, with empty storage — on every launch, so
   * anything kept only in localStorage was forgotten each time the app
   * started. The server writes the saved values into the page it serves
   * (<meta name="studio-prefs">, and the theme on <html>), so they are
   * in force before the first paint. localStorage is the fallback for
   * a page that cannot reach the route, and keeps a copy.
   */
  var PREF_DEFAULTS = {
    theme: 'system', zoom: 100, fit: 'width',
    // Off by default. The fixtures describe one version of one
    // document; a resume changes because the person changed jobs, so
    // checking every build against a frozen copy is noise most days.
    snapshot: false,
    // Off by default: the suites test the pipeline, which does not
    // change between two saves of your resume, and they cost ~9s.
    tests: false,
    highlight: true, diagnostics: false,
  };
  var prefsFromServer = false;
  var prefs = (function () {
    var p = Object.assign({}, PREF_DEFAULTS);
    var meta = document.querySelector('meta[name="studio-prefs"]');
    if (meta) {
      try { Object.assign(p, JSON.parse(meta.getAttribute('content') || '{}')); prefsFromServer = true; } catch { /* keep defaults */ }
    }
    if (!prefsFromServer) {
      try {
        var stored = JSON.parse(localStorage.getItem('studio.prefs') || 'null');
        if (stored && typeof stored === 'object') Object.assign(p, stored);
        else {
          // The two flags this page kept before there were prefs.
          var snap = localStorage.getItem('studio.snapshot');
          var tst = localStorage.getItem('studio.tests');
          if (snap !== null) p.snapshot = snap === '1';
          if (tst !== null) p.tests = tst === '1';
        }
      } catch { /* storage unavailable: defaults */ }
    }
    return p;
  })();

  function savePrefs(patch) {
    Object.assign(prefs, patch);
    try { localStorage.setItem('studio.prefs', JSON.stringify(prefs)); } catch { /* ignore */ }
    api('PUT', '/api/prefs', patch).catch(function () { /* the local copy stands */ });
  }

  var state = {
    active: 'resume',
    // Percent of the page's true size, 8.5in = 816 CSS px, used when
    // `fit` is 'none'; 'width' and 'page' size the page to the pane.
    zoom: Math.min(200, Math.max(25, Math.round(Number(prefs.zoom)) || 100)),
    fit: ['none', 'width', 'page'].indexOf(prefs.fit) === -1 ? 'width' : prefs.fit,
    paused: false,
    status: null,
    files: [],
    dataSource: null,
    log: [],
    render: {},   // per doc: {images, pages, meta, timings, totalMs, invariants, mode, note}
    busy: {},     // per doc: 'render' | 'build' | null
    error: {},      // per doc: the render failed — YAML is not valid
    buildError: {}, // per doc: the render is fine, the CLI build failed
    renderedAt: {}, // per doc: when the render in state.render arrived
    busySince: {},  // per doc: when state.busy was set
    snapshot: prefs.snapshot,
    tests: prefs.tests,
    // Diagnostics opened by a failure (not by the user): open for the
    // rest of the session, but not saved as the user's choice.
    diagAuto: false,
    editor: 'default',  // what Open in editor uses: 'vscode' | 'default'
  };

  /* ─── theme: System / Light / Dark ─────────────────────────────
   *
   * A radio group (WAI-ARIA APG "Radio Group"): Tab reaches the checked
   * option, the arrow keys move and choose, and Ctrl+Shift+L cycles from
   * anywhere. "System" follows the OS and sets no attribute; the server
   * renders the saved choice onto <html>, so there is no flash.
   */
  var THEMES = ['system', 'light', 'dark'];
  var THEME_LABEL = { system: 'System', light: 'Light', dark: 'Dark' };
  function themeRadios() { return Array.prototype.slice.call($('themeGroup').querySelectorAll('[role="radio"]')); }
  function applyTheme(choice) {
    if (choice === 'light' || choice === 'dark') root.setAttribute('data-theme', choice);
    else root.removeAttribute('data-theme');
    themeRadios().forEach(function (b) {
      var on = b.dataset.themeChoice === choice;
      b.setAttribute('aria-checked', String(on));
      b.tabIndex = on ? 0 : -1;
    });
  }
  function setTheme(choice, announce) {
    applyTheme(choice);
    savePrefs({ theme: choice });
    if (announce) say('Theme: ' + THEME_LABEL[choice]);
  }
  themeRadios().forEach(function (b) {
    b.addEventListener('click', function () { setTheme(b.dataset.themeChoice, false); });
    b.addEventListener('keydown', function (e) {
      var step = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 }[e.key];
      if (!step) return;
      e.preventDefault();
      var i = (THEMES.indexOf(b.dataset.themeChoice) + step + THEMES.length) % THEMES.length;
      setTheme(THEMES[i], false);
      themeRadios()[i].focus();
    });
  });
  applyTheme(prefs.theme);

  /* ─── document rail ────────────────────────────────────────── */

  function docMeta(id) {
    return (state.status && state.status.documents && state.status.documents[id]) || null;
  }

  /*
   * Busy, as shown. Most renders take 100–300 ms, and a "Rendering"
   * pulse that flashes on and off for each of them is noise that says
   * nothing: the pages changing says it. So a render only shows as busy
   * once it has run for BUSY_SHOW_MS; a build always does (it takes
   * seconds, and was asked for).
   */
  var BUSY_SHOW_MS = 400;
  function busyShown(id) {
    var b = state.busy[id];
    if (!b) return null;
    if (b === 'build') return b;
    return Date.now() - (state.busySince[id] || 0) >= BUSY_SHOW_MS ? b : null;
  }
  function setBusy(id, what) {
    state.busy[id] = what;
    state.busySince[id] = what ? Date.now() : 0;
    if (what === 'render') {
      var since = state.busySince[id];
      setTimeout(function () {
        if (state.busy[id] === 'render' && state.busySince[id] === since) renderAll();
      }, BUSY_SHOW_MS + 10);
    }
  }

  function statusFor(id) {
    var busy = busyShown(id);
    if (busy === 'build') return { c: 'ok run', t: 'Building' };
    if (busy === 'render') return { c: 'ok run', t: 'Rendering' };
    if (state.error[id]) return { c: 'err', t: 'Render failed' };
    if (state.buildError[id]) return { c: 'err', t: 'Build failed' };
    var m = docMeta(id);
    if (!m) return { c: 'idle', t: 'Unknown' };
    if (!m.pdf.exists) return { c: 'idle', t: 'Not built' };
    return { c: 'ok', t: 'Built · ' + ago(m.pdf.mtimeMs), prefix: 'Built · ', at: m.pdf.mtimeMs };
  }

  /** A relative time that keeps itself current; see tickTimes. */
  function agoSpan(prefix, at) {
    return '<span data-ago="' + esc(at) + '" data-prefix="' + esc(prefix) + '">'
      + esc(prefix + ago(at)) + '</span>';
  }

  // "Built · 5s ago" read "5s ago" for as long as the window stayed
  // open. Every 15 s the times are brought up to date in place: no
  // redraw, and nothing announced (none of them is in a live region).
  function tickTimes() {
    var nodes = document.querySelectorAll('[data-ago]');
    for (var i = 0; i < nodes.length; i++) {
      var t = (nodes[i].dataset.prefix || '') + ago(Number(nodes[i].dataset.ago));
      if (nodes[i].textContent !== t) nodes[i].textContent = t;
    }
  }
  setInterval(tickTimes, 15000);

  /** How full the last page is, as a whole percent, or null. */
  function lastPageFill(r) {
    var f = r && r.invariants && r.invariants.fill;
    if (!f || !f.length || typeof f[f.length - 1] !== 'number') return null;
    return Math.round(f[f.length - 1] * 100);
  }

  function renderRail() {
    var list = $('docList');
    list.innerHTML = '';
    ['resume', 'letter'].forEach(function (id) {
      var m = docMeta(id);
      if (!m) return;
      var st = statusFor(id);
      var r = state.render[id];

      var card = el('div', 'doc' + (state.active === id ? ' is-active' : ''));
      card.setAttribute('role', 'group');
      card.setAttribute('aria-label', m.label);

      var head = el('div', 'doc-head');
      var name = el('h2', 'doc-name');
      var pick = el('button', 'doc-pick', esc(m.label));
      if (state.active === id) pick.setAttribute('aria-current', 'true');
      pick.setAttribute('aria-keyshortcuts', (id === 'resume' ? 'Control+1' : 'Control+2') + ' Control+Tab');
      pick.title = 'Show the ' + m.label + (id === 'resume' ? ' (Ctrl+1)' : ' (Ctrl+2)');
      name.appendChild(pick);
      head.appendChild(name);
      head.appendChild(el('span', 'doc-kind',
        id === 'resume' ? 'paginated' : 'single page'));
      card.appendChild(head);

      // One line that actually says something, rather than a constant
      // path plus a second line of transient news underneath it.
      //
      // It names the file the next build will read, whether that came
      // from the data-source toggle or from picking one in Studio. The
      // full path is in the tooltip.
      var df = m.dataFile;
      var label, title;
      // The imported name only stands while the local file is the one
      // being read. Switch the source to `default` and the build reads
      // the committed file — naming the dropped file there would be the
      // same lie this line just stopped telling.
      if (df) {
        label = df.name;
        title = df.path
          + (df.picked ? ' — picked in Studio, read in place'
             : df.forced ? ' — forced by the data-source setting'
             : ' — resolved automatically')
          + (df.missing ? ' — MISSING' : '');
      } else {
        label = 'no data file';
        title = '';
      }

      var src = el('div', 'doc-src',
        '<svg aria-hidden="true" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>'
        + '<span class="n">' + esc(label) + '</span>'
        // Red alone is not a message (1.4.1, and lost in forced colors).
        + (df && df.missing ? '<span class="miss"><span class="sr-only">, </span>missing</span>' : ''));
      src.title = title;
      if (df && df.missing) src.classList.add('missing');
      card.appendChild(src);

      var meta = el('div', 'doc-meta');
      meta.appendChild(el('span', 'status ' + st.c, '<i></i>'
        + (st.at ? agoSpan(st.prefix, st.at) : esc(st.t))));
      if (r && r.pages) meta.appendChild(el('span', 'chip', r.pages + (r.pages === 1 ? ' page' : ' pages')));
      var fill = lastPageFill(r);
      if (fill !== null && r.pages) {
        var fc = el('span', 'chip', esc('last page ' + fill + '% full'));
        fc.title = 'How far down its body the last page reaches (the lower of the two columns). '
          + 'Room left for another line or two, or a page about to spill.';
        meta.appendChild(fc);
      }
      if (r && r.totalMs) meta.appendChild(el('span', 'chip', r.totalMs + ' ms'));
      card.appendChild(meta);

      if (busyShown(id)) {
        var track = el('div', 'track', '<span></span>');
        track.setAttribute('role', 'progressbar');
        track.setAttribute('aria-label', busyShown(id) === 'build' ? 'Building' : 'Rendering');
        card.appendChild(track);
      }

      var acts = el('div', 'doc-actions');
      var load = el('button', 'btn', 'Load…');
      load.title = 'Choose a .yml file for ' + m.label;
      load.addEventListener('click', function (e) { e.stopPropagation(); pickFile(id); });
      var build = el('button', 'btn primary', 'Build ' + m.label + ' PDF');
      // aria-disabled, not disabled: a disabled button cannot hold focus,
      // so the render that follows a press would drop a keyboard user's
      // focus to <body>, and it would stay there after the build. This
      // one keeps focus and says it is unavailable; the click is ignored.
      var buildBusy = Boolean(state.busy.resume || state.busy.letter);
      build.setAttribute('aria-disabled', String(buildBusy));
      if (state.active === id) {
        build.title = 'Build the PDF into dist/ (Ctrl+Shift+B)';
        build.setAttribute('aria-keyshortcuts', 'Control+Shift+B');
      } else {
        build.title = 'Build the PDF into dist/';
      }
      build.addEventListener('click', function (e) {
        e.stopPropagation();
        if (!buildBusy) doBuild(id);
      });
      acts.appendChild(build);
      acts.appendChild(load);
      card.appendChild(acts);

      if (id === 'resume') {
        var optLabel = el('label', 'doc-opt');
        var snapCb = el('input');
        snapCb.type = 'checkbox';
        snapCb.id = 'snap-' + id;
        snapCb.checked = state.snapshot;
        snapCb.addEventListener('click', function (e) { e.stopPropagation(); });
        snapCb.addEventListener('change', function () {
          state.snapshot = snapCb.checked;
          savePrefs({ snapshot: state.snapshot });
        });
        optLabel.appendChild(snapCb);
        optLabel.appendChild(el('span', null, 'Compare against snapshot'));
        optLabel.title = 'Report differences from tests/fixtures. Never blocks the build.';
        card.appendChild(optLabel);

        var testLabel = el('label', 'doc-opt');
        var testCb = el('input');
        testCb.type = 'checkbox';
        testCb.id = 'tests-' + id;
        testCb.checked = state.tests;
        testCb.addEventListener('click', function (e) { e.stopPropagation(); });
        testCb.addEventListener('change', function () {
          state.tests = testCb.checked;
          savePrefs({ tests: state.tests });
        });
        testLabel.appendChild(testCb);
        testLabel.appendChild(el('span', null, 'Run unit tests first'));
        testLabel.title = 'Runs the full suite before building — about 9 seconds. '
          + 'They test the pipeline, not your data; validate_data and the layout '
          + 'invariants run either way.';
        card.appendChild(testLabel);
      }

      if (state.buildError[id]) {
        var notice = state.buildError[id].kind === 'notice';
        var be = el('div', notice ? 'errcard notice' : 'errcard');
        be.appendChild(el('div', 'loc', notice ? 'Snapshot differs' : 'Build failed'));
        state.buildError[id].lines.forEach(function (line) {
          be.appendChild(el('div', 'msg', esc(line)));
        });
        if (state.buildError[id].hint) {
          be.appendChild(el('div', 'fix', esc(state.buildError[id].hint)));
        }
        var dismiss = el('button', 'btn tiny', 'Dismiss');
        dismiss.addEventListener('click', function (e) {
          e.stopPropagation(); delete state.buildError[id]; renderRail();
        });
        be.appendChild(dismiss);
        card.appendChild(be);
      }

      // One row, one deliverable. This used to be two rows with a
      // checkbox each, back when a Build could also write a grayscale
      // PDF; there is nothing to choose any more, so the row is a plain
      // label and its one action.
      var tray = el('div', 'tray');
      {
        var info = m.pdf;
        // The path comes from the server. It used to be assembled here
        // from the document id and the variant, which worked only
        // while the outputs were named after the document; they are
        // named after you now (Gaius_Caesar_Resume.pdf), and that name
        // lives in YAML this page never sees. pdfInfo sends it whether
        // or not the file exists, so the tooltip is right either way.
        var file = info.path || '';
        var row = el('div', 'tray-row');
        if (file) row.title = file;
        row.appendChild(el('div', 'f', 'PDF'));

        // "Show (217 KB)" rather than a bare size.
        //
        // The size alone read as a label, so the fact that it was a
        // button you could press to open the file in Explorer was
        // invisible. Leading with the verb makes the row's one action
        // legible; the size stays as the parenthetical it always was.
        var right = el(info.exists && file ? 'button' : 'div', 's',
          info.exists ? 'Show (' + esc(kb(info.bytes)) + ')' : 'not built');
        if (info.exists && file) {
          right.className = 's link';
          right.title = 'Show ' + file + ' in file manager';
          right.addEventListener('click', function (e) {
            e.preventDefault(); e.stopPropagation(); reveal(file);
          });
        }
        row.appendChild(right);
        if (!info.exists) row.classList.add('absent');
        tray.appendChild(row);
      }
      card.appendChild(tray);

      card.addEventListener('click', function () { select(id); });
      list.appendChild(card);
    });
  }

  /* ─── canvas ───────────────────────────────────────────────── */

  /* ─── where an error is ────────────────────────────────────────
   *
   * The build reports a schema error as `data/resume.yml:42:5: message`
   * (after a prefix such as "invalid resume data — "), and a YAML syntax
   * error as "data/resume.yml could not be read as YAML." followed by
   * PyYAML's own text, whose last "line N, column M" is where it gave
   * up. Either way the location comes first in the overlay, because
   * that is where you go next. The path is project-relative, with
   * backslashes on Windows; only data/ and styles/ files are matched,
   * which are the only ones /api/open will open.
   */
  var LOC_RE = /((?:data|styles)[\\/][^\n:]*?\.(?:ya?ml|scss)):(\d+):(\d+):\s*/;
  var YAML_RE = /((?:data|styles)[\\/][^\n]*?\.ya?ml) could not be read as YAML\.?\s*/;
  function errorLocation(message) {
    var text = String(message || '');
    var m = LOC_RE.exec(text);
    if (m) {
      return { file: m[1], line: Number(m[2]), col: Number(m[3]),
               rest: text.slice(m.index + m[0].length) || text };
    }
    m = YAML_RE.exec(text);
    if (m) {
      var tail = text.slice(m.index + m[0].length);
      var at = null, re = /line (\d+), column (\d+)/g, x;
      while ((x = re.exec(tail)) !== null) at = x;
      return { file: m[1], line: at ? Number(at[1]) : 1, col: at ? Number(at[2]) : 1,
               rest: 'Not valid YAML.\n' + tail.trim() };
    }
    return null;
  }
  function locText(loc) { return loc.file + ':' + loc.line + ':' + loc.col; }

  /* The overlay's current error, for its two buttons. */
  var overlayLoc = null;

  function renderOverlay(id, r) {
    var box = $('errOverlay');
    var err = state.error[id];
    var kind = null, loc = null, msg = '', held = '', notice = false;
    if (err) {
      kind = 'Render failed';
      loc = errorLocation(err);
      msg = loc ? loc.rest : err;
      held = r && r.images && r.images.length
        ? 'Showing last good render' + (state.renderedAt[id] ? ' · ' + clock(state.renderedAt[id]) : '')
        : 'Nothing rendered yet';
    } else if (r && r.invariants && r.invariants.ok === false) {
      kind = 'Layout check failed';
      notice = true;
      msg = r.invariants.message || 'content overflows its page';
      held = 'The preview is what would print. A Build will refuse this.';
    } else if (r && r.mode === 'built' && r.note) {
      kind = 'Not built';
      notice = true;
      msg = r.note;
    }
    box.hidden = kind === null;
    // What a screen reader hears: once per failure, not on every redraw
    // (the canvas is redrawn on every busy flag and zoom step).
    var alertText = err ? 'Render failed' + (loc ? ' at ' + loc.file + ', line ' + loc.line
      + ', column ' + loc.col : '') + ': ' + msg : '';
    if ($('alertSay').textContent !== alertText) $('alertSay').textContent = alertText;
    if (kind === null) { overlayLoc = null; return; }
    box.className = 'erroverlay' + (notice ? ' notice' : '');
    $('eoKind').textContent = kind;
    $('eoLoc').textContent = loc ? locText(loc) : '';
    $('eoLoc').hidden = !loc;
    $('eoMsg').textContent = msg;
    $('eoHeld').textContent = held;
    overlayLoc = loc;
    $('eoCopy').hidden = !loc;
    $('eoOpen').hidden = !loc;
    if (loc) {
      $('eoOpen').textContent = state.editor === 'vscode' ? 'Open in VS Code' : 'Open file';
      $('eoOpen').title = state.editor === 'vscode'
        ? 'Open ' + loc.file + ' in VS Code at line ' + loc.line + ', column ' + loc.col
        : 'Open ' + loc.file + ' in its default program (it cannot be sent to line ' + loc.line + ')';
    }
  }

  async function copyText(text) {
    try {
      await navigator.clipboard.writeText(text);
      return true;
    } catch {
      // No async clipboard (an older webview, a denied permission).
      var ta = el('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch { ok = false; }
      ta.remove();
      return ok;
    }
  }

  $('eoCopy').addEventListener('click', async function () {
    if (!overlayLoc) return;
    var text = locText(overlayLoc);
    var ok = await copyText(text);
    say(ok ? 'Copied ' + text : 'Could not copy ' + text);
    toast(ok ? 'Copied' : 'Could not copy', text);
  });
  $('eoOpen').addEventListener('click', function () {
    if (overlayLoc) openSource(overlayLoc.file, overlayLoc.line, overlayLoc.col);
  });

  async function openSource(file, line, col) {
    try {
      var r = await api('POST', '/api/open', { path: file, line: line || 1, col: col || 1 });
      toast(r.editor === 'vscode' ? 'Opened in VS Code' : 'Opened', r.opened
        + (line && r.editor === 'vscode' ? ':' + line : ''));
    } catch (err) {
      toast('Could not open it', err.message.slice(0, 90));
    }
  }

  /* ─── zoom ─────────────────────────────────────────────────────
   *
   * 100% is the page's true size: 8.5in, 816 CSS px, as a PDF viewer
   * means it. `fit` sizes the page to the pane instead — 'width' (the
   * default) or 'page' (a whole page top to bottom) — and is kept up to
   * date as the window is resized. 'width' puts two pages side by side
   * when the pane is wide enough for both at TWO_UP_MIN (70%) or more,
   * so a two-page résumé is seen whole, spread and balance included, as
   * it will be judged; a narrower pane gets one page across.
   *
   * The cap is 200%. The pages are rasterized at 144 dpi (scale 2,
   * 1224 px across), so past 150% the image is being enlarged; 200% is
   * as far as that stays useful for checking a detail. That is a
   * choice the user makes with the zoom buttons: the fits stop at the
   * raster's own width (FIT_MAX_PX, 150%), so a wide window does not
   * default to a blurry, upscaled page.
   *
   * WHICH KEYS
   * ----------
   * Ctrl+plus / Ctrl+minus / Ctrl+0 are left to the browser (and to
   * WebView2, which the desktop shell lets zoom — main.rs,
   * zoom_hotkeys_enabled): they enlarge the whole interface, text
   * included, which is what WCAG 1.4.4 needs and what every browser
   * user expects of them. The preview has its own: Ctrl+wheel (or a
   * pinch) over the pages, the toolbar, + − 0 while the preview has
   * focus, and Ctrl+8 / Ctrl+9 for the two fits.
   */
  var ZOOM_STEPS = [25, 33, 50, 67, 75, 90, 100, 110, 125, 150, 175, 200];
  var PAGE_W = 816, PAGE_H = 1056;
  // The raster's width in px: PAGE_W at scale 2 (144 dpi) over 96 dpi.
  var RASTER_SCALE = 2;
  var FIT_MAX_PX = Math.round(PAGE_W * RASTER_SCALE * 72 / 96);   // 1224
  // Below this a page is too small to read, and one page across wins.
  var TWO_UP_MIN = Math.round(PAGE_W * 0.70);                        // 571

  function fitWidthPx(mode) {
    var s = $('scroller');
    var cs = getComputedStyle(s);
    var w = s.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    if (mode === 'page') {
      // The page and its label line beneath it.
      var h = s.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - 24;
      w = Math.min(w, h * PAGE_W / PAGE_H);
    } else {
      // Two across, less the gap between them, when both stay readable.
      // The letter is sized the same, so switching documents keeps the
      // page the size it was.
      var two = Math.floor((w - (parseFloat(cs.columnGap) || 0)) / 2);
      if (two >= TWO_UP_MIN) w = two;
    }
    return Math.max(120, Math.min(FIT_MAX_PX, Math.floor(w)));
  }
  function sheetWidthPx() {
    return state.fit === 'width' || state.fit === 'page'
      ? fitWidthPx(state.fit)
      : Math.round(PAGE_W * state.zoom / 100);
  }
  function effectiveZoom() { return Math.round(sheetWidthPx() / PAGE_W * 100); }

  /** Size the sheets on screen in place, and the zoom readout. */
  function sizeSheets() {
    var w = sheetWidthPx();
    var wraps = $('scroller').querySelectorAll('.sheet-wrap');
    // Exactly that wide: a zoom past the pane's width scrolls, as it
    // should, rather than being capped at the pane (min(…, 100%) made
    // every step past it do nothing).
    for (var i = 0; i < wraps.length; i++) wraps[i].style.width = w + 'px';
    var label = (state.fit === 'width' ? 'Fit width · ' : state.fit === 'page' ? 'Fit page · ' : '')
      + effectiveZoom() + '%';
    if ($('zoomVal').textContent !== label) $('zoomVal').textContent = label;
    $('fitWidth').setAttribute('aria-pressed', String(state.fit === 'width'));
    $('fitPage').setAttribute('aria-pressed', String(state.fit === 'page'));
    $('zoom100').setAttribute('aria-pressed', String(state.fit === 'none' && state.zoom === 100));
    // aria-disabled, not disabled: see the Build button.
    $('zoomIn').setAttribute('aria-disabled', String(effectiveZoom() >= ZOOM_STEPS[ZOOM_STEPS.length - 1]));
    $('zoomOut').setAttribute('aria-disabled', String(effectiveZoom() <= ZOOM_STEPS[0]));
  }

  function setZoom(fit, zoom, anchor) {
    var s = $('scroller');
    // Keep the point under the pointer (or the middle of the pane) where
    // it is, as far as the reflow allows.
    var ax = anchor ? anchor.x : s.clientWidth / 2, ay = anchor ? anchor.y : s.clientHeight / 2;
    var fx = (s.scrollLeft + ax) / Math.max(1, s.scrollWidth);
    var fy = (s.scrollTop + ay) / Math.max(1, s.scrollHeight);
    var before = sheetWidthPx();
    state.fit = fit;
    if (zoom != null) state.zoom = Math.min(ZOOM_STEPS[ZOOM_STEPS.length - 1], Math.max(ZOOM_STEPS[0], zoom));
    if (sheetWidthPx() !== before) clearHighlights();
    sizeSheets();
    s.scrollLeft = fx * s.scrollWidth - ax;
    s.scrollTop = fy * s.scrollHeight - ay;
    savePrefs({ fit: state.fit, zoom: state.zoom });
  }
  function zoomStep(dir, anchor) {
    var cur = effectiveZoom();
    var next = dir > 0
      ? ZOOM_STEPS.filter(function (z) { return z > cur; })[0]
      : ZOOM_STEPS.filter(function (z) { return z < cur; }).pop();
    if (next == null) next = dir > 0 ? ZOOM_STEPS[ZOOM_STEPS.length - 1] : ZOOM_STEPS[0];
    setZoom('none', next, anchor);
  }

  $('zoomIn').addEventListener('click', function () { zoomStep(1); });
  $('zoomOut').addEventListener('click', function () { zoomStep(-1); });
  $('zoom100').addEventListener('click', function () { setZoom('none', 100); });
  $('fitWidth').addEventListener('click', function () { setZoom('width'); });
  $('fitPage').addEventListener('click', function () { setZoom('page'); });

  // Ctrl+wheel and trackpad pinch (which arrives as Ctrl+wheel) over the
  // pages zoom the pages, not the interface. Not passive, so that
  // preventDefault can stop the browser's own page zoom; elsewhere in
  // the window Ctrl+wheel still zooms everything, as in any browser.
  var wheelAcc = 0;
  $('scroller').addEventListener('wheel', function (e) {
    if (!e.ctrlKey) return;
    e.preventDefault();
    wheelAcc += e.deltaY * (e.deltaMode === 1 ? 33 : e.deltaMode === 2 ? 400 : 1);
    if (Math.abs(wheelAcc) < 60) return;
    var rect = $('scroller').getBoundingClientRect();
    zoomStep(wheelAcc < 0 ? 1 : -1, { x: e.clientX - rect.left, y: e.clientY - rect.top });
    wheelAcc = 0;
  }, { passive: false });

  // Fit modes follow the pane's size.
  if (typeof ResizeObserver === 'function') {
    var lastFitW = 0;
    new ResizeObserver(function () {
      if (state.fit === 'none') return;
      var w = sheetWidthPx();
      if (w === lastFitW) return;
      lastFitW = w;
      clearHighlights();
      sizeSheets();
    }).observe($('scroller'));
  }

  function renderCanvas() {
    var id = state.active;
    var m = docMeta(id);
    var r = state.render[id];

    $('canvasDoc').textContent = m ? m.label : '—';
    $('canvasMode').textContent = r && r.mode === 'built'
      ? '· last built PDF' : '· printed PDF';

    var flag = $('liveFlag');
    var busy = busyShown(id);
    flag.className = 'liveflag' +
      (state.paused ? ' paused' : (busy ? ' busy' : (m && m.live ? '' : ' paused')));
    $('liveText').textContent = busy
      ? (busy === 'build' ? 'Building' : 'Rendering')
      : state.paused ? 'Paused' : (m && m.live ? 'Live' : 'On build');
    // Both documents are live; 'On build' remains only for a future
    // document type that has no live pipeline.
    $('liveMs').textContent = r && r.totalMs ? r.totalMs + ' ms' : '—';
    // What a screen reader hears from the flag (the visible text is
    // hidden from it): nothing while a render runs and nothing on each
    // save, only a change of outcome. A failure is the overlay's to
    // announce, so it just clears this; the recovery is then news.
    // Pausing is announced by its toast and the button's pressed state.
    if (!state.busy[id]) {
      var n = r && r.images ? r.images.length : 0;
      var sayText = state.error[id] || !r ? ''
        : 'Preview up to date' + (n ? ', ' + n + (n === 1 ? ' page' : ' pages') : '');
      if ($('liveSay').textContent !== sayText) $('liveSay').textContent = sayText;
    }

    renderOverlay(id, r);

    var s = $('scroller');
    s.innerHTML = '';
    sizeSheets();

    if (!r || !r.images || !r.images.length) {
      if (state.busy[id]) {
        s.appendChild(el('div', 'placeholder', 'Rendering…'));
        return;
      }
      // Not "press Build": a Build writes the PDF, it is not how the
      // preview starts. What starts it is saving the YAML.
      var df = m && m.dataFile;
      var ph = el('div', 'placeholder');
      ph.appendChild(el('div', null, state.error[id]
        ? 'Nothing to show until the file renders. Fix it in your editor and save — the preview follows each save.'
        : 'Nothing to show yet. Edit ' + esc(df ? df.path : 'your YAML in data/')
          + ' in your editor and save — the preview follows each save.'));
      if (df && df.path && !df.missing) {
        var open = el('button', 'btn tiny empty-act', 'Open ' + esc(df.name));
        open.title = 'Open ' + df.path + (state.editor === 'vscode' ? ' in VS Code' : ' in its default program');
        open.addEventListener('click', function () { openSource(df.path, 1, 1); });
        ph.appendChild(open);
      }
      s.appendChild(ph);
      return;
    }

    var keep = new Map();
    var width = sheetWidthPx();
    var marks = activeHighlights(id);
    r.images.forEach(function (im, i) {
      var wrap = el('div', 'sheet-wrap');
      wrap.style.width = width + 'px';
      // Which page this sheet shows, for the IntersectionObserver that
      // decides render order and for a streamed page arriving into it.
      wrap.dataset.page = String(im.page);

      var sheet = el('div', 'sheet' + (state.error[id] ? ' held' : ''));
      var key = im.hash || im.png;
      // Two identical pages (two blank ones, say) need two elements.
      var img = keep.has(key) ? pageImage(im, true) : pageImage(im);
      keep.set(key, img);
      sheet.appendChild(img);
      if (marks) drawMarks(sheet, marks.byPage[im.page], marks);
      wrap.appendChild(sheet);

      var label = 'Page ' + im.page + ' of ' + r.images.length + ' · US Letter';
      var right = im.width + ' × ' + im.height + ' px';
      wrap.appendChild(el('div', 'sheet-label',
        '<span>' + esc(label) + '</span><span class="budget">' + esc(right) + '</span>'));
      s.appendChild(wrap);
    });
    pageImages = keep;
    watchSheets();
    // The canvas is rebuilt on every state change — a busy flag, a zoom
    // step — and a render in flight has pages on screen that are not in
    // state.render yet. Put them back, or they would blink back to the
    // previous render's until the reply lands.
    repaintStreamed(id);
  }

  /* ─── what changed ─────────────────────────────────────────────
   *
   * After a render, the regions of each page that differ from the
   * previous render are outlined for a moment, so an edit's effect —
   * and any knock-on reflow elsewhere on the page — is visible without
   * comparing two pages by eye.
   *
   * HOW
   * Only pages whose hash changed are compared. Each PNG is decoded and
   * shrunk to a quarter of its size in one step by createImageBitmap
   * (off the main thread), drawn into a canvas, and compared pixel by
   * pixel; differences are collected into 8 px cells (32 px of the
   * full raster), neighbouring cells are joined, and each group's
   * bounding box becomes one outline. The work runs when the page is
   * idle (requestIdleCallback), and the quarter-size pixels of the
   * current pages are kept, so each render decodes only its new pages.
   *
   * WHY NOT A WORKER: the page's CSP has no worker-src, so it falls
   * back to script-src, which admits only the inline script's hash — a
   * Blob-URL worker is refused. The main thread at quarter scale is a
   * few milliseconds a page (measured; shown under Diagnostics).
   *
   * Not drawn after the first render (nothing to compare with), and
   * dropped when the pages are resized (a zoom step, a new display
   * scale): the outlines are placed in percentages and would still
   * line up, but a highlight that appears on a zoom is news about
   * nothing.
   */
  var DIFF_SCALE = 4, DIFF_CELL = 8, DIFF_THRESHOLD = 48, MARK_MS = 4000;
  var quarterCache = new Map();   // page hash -> {w, h, data}
  var highlight = null;           // {doc, byPage: {page: [[x0,y0,x1,y1] fractions]}, at, dpr, width}

  }

      d.style.height = ((b[3] - b[1]) * 100).toFixed(2) + '%';

  /*
   * A page at a quarter of its size, as pixels, always the same way:
   * decoded from its PNG by createImageBitmap, which shrinks it in the
   * same step. Never from the <img> on screen, although that one is
   * already decoded: drawImage's downscale and createImageBitmap's are
   * different filters, and the same PNG read both ways differs in about
   * 18,000 of a page's 121,000 quarter-size pixels (measured) — a page
   * whose "before" came one way and "after" the other was outlined
   * from top to bottom for a one-word edit.
   */
  var diffCanvas = null;
  var diffCpu = 0;   // ms of main-thread work in the current comparison
  async function quarterPixels(im) {
    var hit = quarterCache.get(im.hash);
    if (hit) return hit;
    if (!im.png) throw new Error('no pixels for page ' + im.page);
    var w = Math.max(1, Math.round(im.width / DIFF_SCALE));
    var h = Math.max(1, Math.round(im.height / DIFF_SCALE));
    var t = performance.now();
    var bin = atob(im.png);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);

      { resizeWidth: w, resizeHeight: h, resizeQuality: 'low' });

    // use the canvas while this one waits for its bitmap.

    diffCanvas.width = w; diffCanvas.height = h;
    var ctx = diffCanvas.getContext('2d', { willReadFrequently: true });
    ctx.drawImage(bmp, 0, 0);
    if (bmp.close) bmp.close();
    var out = { w: w, h: h, data: ctx.getImageData(0, 0, w, h).data };
    diffCpu += performance.now() - t;
    quarterCache.set(im.hash, out);

  }

  /**
   * Shrink the pages on screen now, while nothing else is happening, so
   * that when the next render changes one of them its "before" is
   * already to hand and only the new page is read.
   */

    if (!prefs.highlight || !r || !r.images) return;
    var todo = r.images.filter(function (im) { return im.hash && im.png && !quarterCache.has(im.hash); });
    if (!todo.length) return;
    var idle = window.requestIdleCallback || function (fn) { return setTimeout(fn, 50); };
    idle(async function () {
      for (var i = 0; i < todo.length; i++) {
        if (state.render[state.active] !== r) return;   // superseded; its pages are no use

      }
    }, { timeout: 2000 });
  }

  /** Boxes, as fractions of the page, around the cells that differ. */
  function diffBoxes(a, b) {
    if (a.w !== b.w || a.h !== b.h) return [[0, 0, 1, 1]];
    var cw = Math.ceil(a.w / DIFF_CELL), ch = Math.ceil(a.h / DIFF_CELL);
    var dirty = new Uint8Array(cw * ch);
    var da = a.data, db = b.data, w = a.w;
    for (var y = 0; y < a.h; y++) {
      var row = (y / DIFF_CELL | 0) * cw;
      for (var x = 0; x < w; x++) {
        var k = (y * w + x) * 4;
        if (Math.abs(da[k] - db[k]) + Math.abs(da[k + 1] - db[k + 1]) + Math.abs(da[k + 2] - db[k + 2]) > DIFF_THRESHOLD) {
          dirty[row + (x / DIFF_CELL | 0)] = 1;
          x = (((x / DIFF_CELL) | 0) + 1) * DIFF_CELL - 1;   // the rest of this cell's row adds nothing
        }
      }
    }
    // Groups of dirty cells, joining any within one cell of each other
    // (a changed line and the one below it are one change, not two).
    var seen = new Uint8Array(cw * ch), boxes = [];
    for (var i = 0; i < dirty.length; i++) {
      if (!dirty[i] || seen[i]) continue;
      var stack = [i], x0 = cw, y0 = ch, x1 = 0, y1 = 0;
      seen[i] = 1;
      while (stack.length) {
        var c = stack.pop(), cx = c % cw, cy = (c / cw) | 0;
        if (cx < x0) x0 = cx; if (cx > x1) x1 = cx;
        if (cy < y0) y0 = cy; if (cy > y1) y1 = cy;
        for (var dy = -2; dy <= 2; dy++) {
          for (var dx = -2; dx <= 2; dx++) {
            var nx = cx + dx, ny = cy + dy;
            if (nx < 0 || ny < 0 || nx >= cw || ny >= ch) continue;
            var n = ny * cw + nx;
            if (dirty[n] && !seen[n]) { seen[n] = 1; stack.push(n); }
          }
        }
      }
      boxes.push([x0 * DIFF_CELL / a.w, y0 * DIFF_CELL / a.h,
                  Math.min(1, (x1 + 1) * DIFF_CELL / a.w), Math.min(1, (y1 + 1) * DIFF_CELL / a.h)]);
    }
    // A reflow can touch most of a page; past a dozen outlines the
    // picture is "everything below here moved", so say that instead.
    if (boxes.length > 12) {
      boxes = [boxes.reduce(function (u, bx) {
        return [Math.min(u[0], bx[0]), Math.min(u[1], bx[1]), Math.max(u[2], bx[2]), Math.max(u[3], bx[3])];
      })];
    }
    return boxes;
  }

  /** Compare a render's pages with the render before it, when idle. */
  function highlightChanges(id, prev, next) {
    var prevByPage = {};
    ((prev && prev.images) || []).forEach(function (im) { prevByPage[im.page] = im; });

    var live = new Set();
    (next.images || []).concat((prev && prev.images) || []).forEach(function (im) { live.add(im.hash); });
    quarterCache.forEach(function (_v, k) { if (!live.has(k)) quarterCache.delete(k); });
    if (!prefs.highlight) return;
    if (!prev || !prev.images || !prev.images.length) { warmQuarterCache(next); return; }
    var pairs = (next.images || []).filter(function (im) {

    var idle = window.requestIdleCallback || function (fn) { return setTimeout(fn, 1); };
    idle(async function () {

      try {
        for (var i = 0; i < pairs.length; i++) {

  /* ─── which pages are on screen ────────────────────────────────
   *
   * The pane lays pages out left to right and wraps, so a wide window
   * shows several at once and a narrow one shows part of the first. The
   * server can render them in any order, and the useful order is the one
   * the eye is on: the pages actually visible, in the order they appear,
   * then the rest.
   *
   * An IntersectionObserver is how that stays true without measuring
   * anything on every render or scroll. When it is unavailable (it is
   * not, in WebView2 or any browser this runs in, but the preview must
   * not depend on it), `visiblePages` is empty and the server simply

        });

    }
    // The set is NOT cleared: the sheets are new elements but they show
    // the same pages, and the observer's callbacks do not run until
    // after this returns. Clearing would leave "what is on screen"
    // empty for exactly as long as it takes to ask, which is when it is
    // asked. Pages that are no longer in the render are filtered out by
    // visiblePages, and the observer corrects the rest a moment later.

  /** The pages to render first: what is on screen, in page order. */
  function visiblePages(id) {
    var r = state.render[id];
    if (!r || !r.images || id !== state.active) return null;
    var all = r.images.map(function (im) { return im.page; });
    var seen = all.filter(function (p) { return onScreen.has(p); });
    if (!seen.length) return null;

  // Decoded page images, by the pixel hash the engine sends. The canvas is
  // redrawn on every state change (a busy flag, a zoom step, a new

  function pageImage(im, fresh) {

  /* ─── inspector ────────────────────────────────────────────── */

    // still offered, because "whichever is there" is a real thing to

    g0.appendChild(el('p', 'eyebrow', 'Outputs'));
    var out = el('div', 'srcbox');

        '<span style="font-family:var(--mono);font-size:10.5px;color:' +
        (info.exists ? 'var(--accent)' : 'var(--muted-2)') + '">' +

    ins.appendChild(g0);

      g2.appendChild(el('p', 'eyebrow', 'PDF metadata'));

        var line = el('div');
        line.style.cssText = 'display:flex;justify-content:space-between;gap:12px;align-items:baseline';

        (st.root || '').split(/[\\/]/).pop()

  // The panes are rebuilt with innerHTML, which drops keyboard focus to

  // back on its replacement: the same control (id, kind and label), or,

  var FOCUSABLE = 'button, select, input, textarea, a[href], summary, [tabindex]:not([tabindex="-1"])';

    var at = before.indexOf(a);

        document.getElementById(pane.id).querySelectorAll(FOCUSABLE));
