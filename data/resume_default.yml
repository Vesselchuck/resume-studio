# ═════════════════════════════════════════════════════════════════
# YOUR RESUME — this is where you edit everything.
#
# Change anything in this file, then run `node render.js` and a new
# PDF appears in the `dist/` folder. You never touch HTML or design
# code; this file is the only thing you maintain.
#
# Three things to know before you start:
#
#   1. INDENTATION MATTERS. The spaces at the start of each line are
#      not decoration — they tell the file what belongs to what.
#      When you copy a section to add a new one, keep the same number
#      of spaces. (Always spaces, never tabs.)
#
#   2. SPECIAL CHARACTERS. If your text contains a colon, a hash (#),
#      or starts with a dash or quote, wrap the whole value in double
#      quotes. Example:  title: "Manager: Operations"
#      Plain text without special characters works fine without quotes.
#
#   3. LINES STARTING WITH # ARE NOTES. They are ignored by the build.
#      You can leave them, delete them, or add your own.
#
# Page layout is automatic. The build measures your content and
# decides where pages break. You only control the content and order;
# the design takes care of the rest.
# ═════════════════════════════════════════════════════════════════


# ─── Your name ───────────────────────────────────────────────────
# Split into first and last because the design styles them
# differently (the last name appears bolder than the first).
name:
  first: Gaius
  last: Caesar


# ─── Job title shown under your name ─────────────────────────────
# A short subtitle that appears below your name on page 1.
# Replace with your target role, OR delete this whole line if you
# don't want a subtitle at all.
role: "Imperator Romanus"


# ─── Contact details (appear in the top-right of page 1) ─────────
# `address` shows on its own line.
# `rows` is a list of clickable lines. Each row needs:
#   - value: the text people see
#   - href:  what happens when someone clicks it. Use:
#       "tel:+15551234567"        → opens phone dialer
#       "mailto:you@example.com"  → opens email app
#       "https://yoursite.com"    → opens a website
#
# Add or remove rows freely. Keep the leading dash and indentation.
contact:
  address: Roma, Imperium Romanum
  rows:
    - value: (000) 000-0000
      href: "tel:+10000000000"
    - value: gcaesar@email.com
      href: "mailto:gcaesar@email.com"


# ─── Document metadata ───────────────────────────────────────────
meta:
  # One-sentence summary of who you are. Used as the PDF's "subject"
  # (visible in PDF viewers' Properties dialog) and as the HTML page
  # description (what search engines and link previews show).
  # The `>-` means "this value continues on the next line(s)."
  description: >-
    Resume of Gaius Caesar — sed gravida elit velit, in pharetra
    based in Roma, Imperium Romanum.

  # The maximum number of pages the resume is allowed to grow to.
  # If your content can't fit in this many pages, the build STOPS
  # with a clear error instead of silently producing a longer PDF.
  # Raise this number if you genuinely need more room.
  maxPages: 4

  # The language your resume is written in. Used by screen readers
  # and other assistive tech to pick the right pronunciation.
  # Examples:  en-US (American English), en-GB (British English),
  #            es-ES (Spanish, Spain), fr-FR (French, France).
  # The first two letters are the language; the last two are the country.
  lang: en-US


# ─── Sidebar (the narrow left column) ────────────────────────────
# A sidebar is made of `blocks`. Each block is a titled list, like
# "Languages" or "Key Skills". You can add, remove, or reorder them.
# The build figures out which blocks fit on which page.
#
# Every block needs three fields:
#   id:      a short unique label using ONLY lowercase letters,
#            numbers, and dashes (no spaces, no underscores).
#            Used by the build internally; it's never shown to readers.
#   type:    either "list" or "details" — see the two kinds below.
#   heading: the bold title that appears above the block.
#
# The fourth field depends on the type:
#   items:   the contents of a "list" block.
#   rows:    the contents of a "details" block.
#
# TWO KINDS OF BLOCKS:
#
#   • "list" blocks
#     A single-column list of bullet points. Use for Languages,
#     Key Skills, Certifications, Interests — anything that's a
#     flat list. Items can optionally be organized into named
#     groups. All three blocks below use this type.
#
#     Inside `items:` you can mix two things:
#       (A) Plain text — each line becomes one bullet. See the
#           Languages block below.
#       (B) A sub-heading using `- group: "..."`. Everything
#           listed AFTER a group line belongs to that group,
#           until the next group line. See the Key Skills block
#           below for a worked example.
#     A block with no groups is just a flat list. A block with
#     groups is a list with sub-headings.
#
#   • "details" blocks
#     A two-column list of LABELED rows: a short label on the left,
#     a value on the right. Use for an additional contact section,
#     online profiles, or any "Label: Value" data. Each row needs
#     `label` and `value`; an optional `href` makes the value
#     clickable (same rules as the contact `href` above).
#
#     The placeholder data doesn't include one; here's the shape
#     if you want to add one. Paste it into the `blocks:` list
#     below, keeping the same indentation as the other blocks:
#
#         - id: online
#           type: details
#           heading: Online
#           rows:
#             - label: LinkedIn
#               value: linkedin.com/in/gcaesar
#               href: "https://linkedin.com/in/gcaesar"
#             - label: GitHub
#               value: github.com/gcaesar
#               href: "https://github.com/gcaesar"
#
#     Note: details blocks are kept whole — the build will never
#     split one across two pages — so they're best for short lists
#     (3–6 rows). Long lists belong in a "list" block.
sidebar:
  blocks:

    # Example of a simple flat list — no groups, just three items.
    - id: languages
      type: list
      heading: Languages
      items:
        - Lingua (Gradus Scientiae)
        - Lingua (Gradus Scientiae)
        - Lingua (Gradus Scientiae)

    # Example of a grouped list — five named groups, each with items.
    # Notice how `- group: "..."` introduces each group, and the
    # plain-text lines beneath it belong to that group.
    - id: key-skills
      type: list
      heading: Key Skills
      items:
        - group: "Duis Justo"
        - Vestibulum Vel Mattis Mauris
        - Suspendisse Mollis Dolor
        - Nullam Maximus Dolor
        - Nullam Posuere Aliquet
        - In Maximus Justo Nec
        - group: "Aliquam Non"
        - Aliquam Ac Diam Quis
        - Pellentesque Egestas Turpis
        - Suspendisse Non Turpis
        - Quisque Ut Eleifend Massa
        - group: "Vestibulum Ante"
        - Nullam Sed Neque Nulla
        - Morbi Placerat Orci
        - Morbi Pharetra Blandit
        - In Cursus Libero Vitae
        - Morbi Ac Tortor Mauris
        - group: "Donec Justo"
        - Fusce Pharetra Sodales
        - Sed Quis Imperdiet Magna
        - Vestibulum A Est Non
        - Aliquam Vehicula Blandit
        - group: "Mauris Risus"
        - Fusce Dapibus Dignissim Feugiat
        - Pellentesque Elementum Turpis
        - Cras Blandit Orci Lectus
        - Duis Viverra Varius Dolor
        - Curabitur Pharetra Leo Quam

    - id: certifications
      type: list
      heading: Certifications
      items:
        - group: "Mauris Quis"
        - Aliquam Ut Nulla Ipsum
        - In Vehicula Orci Sed
        - Duis Ac Metus Ullamcorper
        - Morbi Consequat Vitae Nulla
        - Aliquam Metus Odio Vulputate
        - group: "Etiam Scelerisque"
        - Aenean Ullamcorper Dignissim
        - Pellentesque Sit Amet Risus
        - Integer Faucibus Scelerisque Metus
        - Fusce Ullamcorper Sem
        - Morbi At Facilisis Justo
        - group: "Curabitur Sollicitudin"
        - Donec Sollicitudin Sapien Magna
        - Vivamus Sed Justo Aliquet
        - In Tincidunt Dui Viverra
        - Nullam Porta Consectetur
        - Consequat In Lacinia Mi Vitae


# ─── Main column (the wide right side of the page) ───────────────
# The main column is made of three sections, in this order:
#   - summary    (a short paragraph about you)
#   - experience (your jobs)
#   - education  (your schools and programs)
#
# You need one of each; you can't add or remove section types here,
# but you can put as much (or as little) content inside each as you
# want. The build automatically flows content across pages.
mainColumn:

  # ─── Summary section ─────────
  # One paragraph introducing who you are professionally.
  # Keep it 3–5 sentences for best fit.
  - type: summary
    heading: Summary
    text: >-
      Sed gravida elit velit, in pharetra lorem tempus id. Maecenas dictum ex in risus molestie, nec faucibus velit malesuada. Nulla viverra est ut molestie laoreet. Fusce et scelerisque diam. Phasellus vel lectus ut nisl maximus rutrum quis ut elit. Lorem ipsum dolor sit amet, consectetur adipiscing elit. Maecenas et efficitur elit, in imperdiet nisi. Pellentesque tempus enim vitae cursus elementum. Praesent molestie risus sed nunc lacinia suscipit. Praesent iaculis nulla.

  # ─── Experience section ─────────
  # List your jobs from most recent to oldest. Each job has these fields:
  #
  #   id:       a short unique label — lowercase letters, numbers,
  #             and dashes only. Not shown to readers; used internally.
  #
  #   title:    the job title and (optionally) the company, comma-separated.
  #             Example: "Senior Designer, Acme Inc."
  #
  #   date:     the date range as you want it displayed. Free text —
  #             use whatever format you prefer:
  #               "Mar 2021 – Present"
  #               "2020 – 2024"
  #               "May 2018 – December 2021"
  #
  #   datetime: the START date in a machine-readable form. This is for
  #             screen readers (so they can announce dates correctly)
  #             and is NEVER displayed visually. Format: "YYYY" or
  #             "YYYY-MM". Examples:  "2021"   or   "2021-03"
  #
  #   location: city, country/state. Free text.
  #
  #   bullets:  a list of achievement lines. Each bullet should describe
  #             a concrete result, ideally with a number. To make part
  #             of a bullet appear bold, wrap it in double asterisks:
  #
  #               "Cut onboarding time by **30%**..."
  #                                       ↑     ↑
  #                        these become bold in the output
  #
  #             Only `**bold**` works. Other markdown (italics, links,
  #             headings) is NOT processed — it would show up as literal
  #             text with the asterisks visible.
  #
  # SPECIAL CASE — career gaps:
  # If you have a period that wasn't employment (relocation, sabbatical,
  # caregiving, education), add an entry with `gap: true` and NO bullets
  # or location. See the `transition-gap` entry below.
  - type: experience
    heading: Work Experience
    jobs:

      - id: nulla
        title: Nulla porta ligula, Aliquam libero
        date: MMM YYYY – MMM YYYY
        datetime: "YYYY-MM"
        location: Roma, Imperium Romanum
        bullets:
          - "Phasellus scelerisque magna quis molestie malesuada. Phasellus venenatis libero at ultrices semper. Suspendisse turpis quam, posuere at aliquam et, porttitor."
          - "Aliquam mattis ipsum tincidunt sodales mattis. Ut lobortis eros lectus, eu rhoncus diam bibendum ut. Vivamus quis tempus purus. Praesent."
          - "Donec a venenatis diam, ac rhoncus nibh. Integer dignissim tempor nunc ut lobortis. Etiam bibendum velit arcu, nec rhoncus ligula."

      # GAP ENTRY example. Notice: no `location`, no `bullets`.
      # The `gap: true` line tells the design to render this entry
      # in a softer style (italic, no bullet points), since it's a
      # non-employment period rather than a job.
      - id: transition-gap
        title: Transitus in Cursum Novum
        date: MMM YYYY – MMM YYYY
        datetime: "YYYY-MM"
        gap: true

      - id: etiam-tincidunt
        title: Etiam tincidunt lacus, Etiam fermentum
        date: MMM YYYY – MMM YYYY
        datetime: "YYYY-MM"
        location: Roma, Imperium Romanum
        bullets:
          - "Vivamus iaculis lectus quam, at pellentesque orci aliquet vestibulum. Duis commodo, massa ac sodales gravida, dui nibh mattis erat, quis."
          - "Proin posuere nulla in neque ultricies, sed viverra velit luctus. Phasellus vitae augue et metus condimentum luctus. Nam tincidunt enim."
          - "Ut sit amet diam nec dolor hendrerit varius. Pellentesque pharetra imperdiet eleifend. Nunc tempor at odio at accumsan. Aliquam hendrerit."

      - id: etiam
        title: Etiam eu dictum, Cras vel
        date: MMM YYYY – MMM YYYY
        datetime: "YYYY-MM"
        location: Roma, Imperium Romanum
        bullets:
          - "Nulla consequat tortor ac mi pellentesque mattis nec euismod elit. Phasellus aliquet bibendum turpis, sed accumsan dolor fermentum non. Aliquam."
          - "Suspendisse vulputate gravida euismod. Aenean in sodales erat. Donec iaculis dignissim tortor quis auctor. Phasellus at justo sit amet eros."
          - "Nullam efficitur finibus lobortis. Proin vulputate at est consequat posuere. Aenean nulla odio, ultrices eu justo quis, aliquam mollis."

      - id: vivamus-sit
        title: Vivamus sit amet, Aenean varius
        date: MMM YYYY – MMM YYYY
        datetime: "YYYY-MM"
        location: Roma, Imperium Romanum
        bullets:
          - "Maecenas vel interdum nunc. Integer ac arcu sagittis, iaculis ipsum in, tristique leo. Vestibulum ut risus non nunc malesuada pulvinar."
          - "Curabitur sed efficitur risus, eu eleifend turpis. Fusce bibendum ex mauris, et tempus eros bibendum quis. Aliquam egestas tortor ac."
          - "Curabitur vehicula dapibus mauris, vel imperdiet diam sagittis eu. Praesent tempus feugiat lorem, sit amet ultrices enim cursus eu. Phasellus."

      - id: aenean
        title: Aenean consectetur, Morbi massa
        date: MMM YYYY – MMM YYYY
        datetime: "YYYY-MM"
        location: Roma, Imperium Romanum
        bullets:
          - "Maecenas euismod, tellus sed laoreet laoreet, orci lacus sodales augue, eget facilisis velit eros a ante. Nulla condimentum lacus in."
          - "Aliquam nisi mauris, venenatis ut vehicula sit amet, vulputate ut massa. Duis in fringilla nibh. Maecenas diam magna, blandit ut."

      - id: vivamus-vulputate
        title: Vivamus vulputate auctor, Nulla pharetra
        date: MMM YYYY – MMM YYYY
        datetime: "YYYY-MM"
