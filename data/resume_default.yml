        bullets:
          - "Sed finibus accumsan nibh pharetra eleifend. Nunc lorem sapien, congue vel semper vel, tincidunt eget metus. Nam a metus leo."
          - "Phasellus sed nisl vitae urna rhoncus sollicitudin in eu nisl. Duis consequat tincidunt libero, vitae laoreet lacus congue eget. Mauris."

  # ─── Education section ─────────
  # Each item has:
  #   title:       the degree or program name (e.g., "Bachelor of Arts in History").
  #   subtitle:    a finer-grained description — concentration, specialty,
  #                or focus area. Optional; remove the line if not needed.
  #   institution: the school, university, or online platform.
  #
  # Add as many entries as you want. List them in the order you want
  # them shown (most prestigious or most recent first is conventional).
  - type: education
    heading: Education
    items:

