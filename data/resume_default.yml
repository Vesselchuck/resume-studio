# ─────────────────────────────────────────────────────────────────
# RESUME DATA — single source of truth.
# Edit this file; run `node render.js` to regenerate dist/index.html.
#
# Page placement is AUTOMATIC: the build pipeline measures content
# heights and assigns sidebar blocks and jobs to pages dynamically.
# Bridging (a job or sidebar block split across pages) is also
# automatic. The only thing you control here is content order and
# the maxPages cap.
# ─────────────────────────────────────────────────────────────────

