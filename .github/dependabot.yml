# Keeps the GitHub Actions used by .github/workflows/ up to date.
# Security alerts for npm, pip and Cargo packages work without this
# file; this adds regular version-update PRs for the workflow's actions.
# The workflows pin each action to a commit with the release in a comment
# (`@<sha> # v7.0.1`); Dependabot updates the commit and the comment
# together.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly