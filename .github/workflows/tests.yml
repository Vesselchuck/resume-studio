# Builds the resume and the cover letter from the shipped templates
# (data/*_default.yml) and runs the whole test suite, on every push to
# main and on every pull request.
#
# The snapshot comparison stays off (its default), because the
# committed fixtures are rendered on Windows and Linux Chromium draws
# text slightly differently. Tests that need your private data files
# (data/resume.yml, data/_profile.yml …) skip themselves here, since
# those files are never on GitHub.

name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Node packages
        run: npm ci

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Build the resume
        run: npm run resume

      - name: Build the cover letter
        run: npm run letter

      - name: Run the tests
        run: npm test

      - name: Keep the built PDFs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdfs
          path: dist/*.pdf
          if-no-files-found: ignore
